<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0722">
<title>Cobalt GameHub · RetroAchievements</title>
<style>
:root{--ink:#f1edff;--dim:#a99fd0;--mute:#7a70a6;--pink:#ff3d9a;--cyan:#3de1ff;--grad:linear-gradient(90deg,var(--pink),var(--cyan));--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(130% 80% at 10% 0%,#1b0f3d,#0d0722 50%,#07040f);color:var(--ink);
  font-family:system-ui,-apple-system,Roboto,sans-serif;padding:22px 16px 40px;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand b{font-size:15px;letter-spacing:.3em;font-weight:500;color:var(--ink)}
.brand small{font-size:11px;color:var(--dim);letter-spacing:.06em;margin-left:4px}
h1{font-size:24px;font-weight:800;line-height:1.2}
p{color:var(--dim);font-size:15px;line-height:1.5}
.pick{display:flex;align-items:center;justify-content:center;gap:10px;height:58px;border-radius:999px;background:var(--grad);color:#14082c;font-weight:700;font-size:17px;border:0;width:100%}
input[type=file]{display:none}
#codeBox{display:flex;flex-direction:column;gap:10px}
#codeBox[hidden],.pick[hidden],#store[hidden]{display:none}
.coderow{display:flex;gap:10px}
#code{flex:1;min-width:0;height:54px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:inherit;
  font:inherit;font-size:26px;letter-spacing:.3em;text-align:center}
#codeGo{height:54px;padding:0 22px;border-radius:999px;border:0;background:var(--grad);color:#14082c;font:inherit;font-weight:700;font-size:16px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.list{display:flex;flex-direction:column;gap:10px}
.x{display:flex;flex-direction:column;gap:8px}
.x .top{display:flex;gap:10px;align-items:center;font-size:15px}
.x .top b{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x .ok{color:#7ef0b0}.x .err{color:#ff8aa5}.x .wait{color:var(--mute)}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.bar span{display:block;height:100%;background:var(--grad);width:0}
.small{font-size:13px;color:var(--mute);line-height:1.5}
.bad{color:#ffd27a}
</style>
<style>
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--dim)}
.field input{height:52px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:inherit;font:inherit;font-size:17px;padding:0 14px}
form.card{display:flex;flex-direction:column;gap:14px}
form[hidden],#done[hidden]{display:none}
.pick:disabled{opacity:.6}
.trophy{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,#ffd27a,#ff3d9a)}
a{color:var(--cyan)}
</style>
</head>
<body>
<!-- Abre no celular pelo QR code da TV (Conquistas → Entrar). A senha vai só para a TV, que entra no
     RetroAchievements e guarda apenas o token da conta. -->
<div class="wrap">
  <div class="brand"><svg width="40" height="40" viewBox="0 0 32 32" shape-rendering="crispEdges"><path fill="#0a051a" d="M12 7h7v1h-7zM11 8h1v1h-1zM19 8h1v1h-1zM9 9h2v1h-2zM20 9h9v1h-9zM8 10h1v1h-1zM29 10h1v1h-1zM8 11h1v1h-1zM30 11h1v1h-1zM7 12h1v1h-1zM23 12h2v1h-2zM30 12h1v1h-1zM6 13h1v1h-1zM24 13h2v1h-2zM30 13h1v1h-1zM4 14h2v1h-2zM24 14h2v1h-2zM30 14h1v1h-1zM3 15h1v1h-1zM24 15h1v1h-1zM29 15h1v1h-1zM2 16h1v1h-1zM28 16h1v1h-1zM1 17h1v1h-1zM6 17h1v1h-1zM27 17h1v1h-1zM0 18h1v1h-1zM5 18h2v1h-2zM25 18h2v1h-2zM0 19h1v1h-1zM5 19h2v1h-2zM24 19h1v1h-1zM0 20h1v1h-1zM6 20h2v1h-2zM23 20h1v1h-1zM0 21h1v1h-1zM22 21h1v1h-1zM1 22h1v1h-1zM22 22h1v1h-1zM2 23h9v1h-9zM20 23h2v1h-2zM11 24h1v1h-1zM19 24h1v1h-1zM12 25h7v1h-7z"/><path fill="#d6c8ff" d="M12 8h1v1h-1zM14 8h1v1h-1zM11 9h3v1h-3zM10 10h5v1h-5zM16 10h1v1h-1zM9 11h3v1h-3zM13 11h3v1h-3zM8 12h7v1h-7zM16 12h1v1h-1zM7 13h7v1h-7zM15 13h1v1h-1zM7 14h6v1h-6zM7 15h1v1h-1zM9 15h1v1h-1zM8 16h1v1h-1z"/><path fill="#8b6cf0" d="M13 8h1v1h-1zM15 8h2v1h-2zM14 9h4v1h-4zM9 10h1v1h-1zM15 10h1v1h-1zM17 10h2v1h-2zM12 11h1v1h-1zM16 11h2v1h-2zM15 12h1v1h-1zM17 12h2v1h-2zM14 13h1v1h-1zM16 13h2v1h-2zM13 14h4v1h-4zM8 15h1v1h-1zM10 15h3v1h-3zM7 16h1v1h-1zM9 16h2v1h-2zM16 16h1v1h-1zM13 17h1v1h-1zM15 17h1v1h-1zM10 18h3v1h-3zM14 18h1v1h-1zM9 19h1v1h-1zM11 19h1v1h-1z"/><path fill="#5438c4" d="M17 8h2v1h-2zM18 9h2v1h-2zM19 10h2v1h-2zM18 11h2v1h-2zM19 12h2v1h-2zM18 13h2v1h-2zM13 15h1v1h-1zM15 15h1v1h-1zM11 16h5v1h-5zM17 16h2v1h-2zM7 17h3v1h-3zM11 17h2v1h-2zM14 17h1v1h-1zM16 17h2v1h-2zM8 18h2v1h-2zM13 18h1v1h-1zM15 18h2v1h-2zM18 18h1v1h-1zM7 19h2v1h-2zM10 19h1v1h-1zM12 19h4v1h-4zM8 20h7v1h-7z"/><path fill="#2d1a78" d="M21 10h1v1h-1zM20 11h2v1h-2zM21 12h1v1h-1zM17 14h2v1h-2zM14 15h1v1h-1zM16 15h2v1h-2zM19 15h3v1h-3zM23 15h1v1h-1zM19 16h2v1h-2zM22 16h1v1h-1zM10 17h1v1h-1zM18 17h2v1h-2zM21 17h1v1h-1zM7 18h1v1h-1zM17 18h1v1h-1zM19 18h2v1h-2zM16 19h2v1h-2zM15 20h1v1h-1zM21 21h1v1h-1zM18 22h1v1h-1zM20 22h1v1h-1zM15 23h1v1h-1zM19 23h1v1h-1zM12 24h1v1h-1zM14 24h1v1h-1zM16 24h1v1h-1zM18 24h1v1h-1z"/><path fill="#3f6e96" d="M22 10h5v1h-5zM22 11h5v1h-5zM25 12h2v1h-2z"/><path fill="#2a80a1" d="M27 10h2v1h-2zM27 11h3v1h-3zM27 12h2v1h-2z"/><path fill="#160c38" d="M22 12h1v1h-1zM20 13h4v1h-4zM19 14h5v1h-5zM18 15h1v1h-1zM22 15h1v1h-1zM21 16h1v1h-1zM23 16h1v1h-1zM20 17h1v1h-1zM22 17h1v1h-1zM18 19h1v1h-1zM23 19h1v1h-1zM21 20h2v1h-2zM18 21h3v1h-3zM15 22h3v1h-3zM19 22h1v1h-1zM21 22h1v1h-1zM11 23h4v1h-4zM16 23h3v1h-3zM13 24h1v1h-1zM15 24h1v1h-1zM17 24h1v1h-1z"/><path fill="#3de1ff" d="M29 12h1v1h-1zM27 13h3v1h-3zM28 14h2v1h-2zM28 15h1v1h-1z"/><path fill="#64c0eb" d="M26 13h1v1h-1zM26 14h2v1h-2zM25 15h3v1h-3zM24 16h4v1h-4zM23 17h4v1h-4zM22 18h3v1h-3z"/><path fill="#7f3874" d="M6 14h1v1h-1zM4 15h3v1h-3zM3 16h4v1h-4zM3 17h3v1h-3zM3 18h2v1h-2zM4 19h1v1h-1z"/><path fill="#942669" d="M2 17h1v1h-1zM1 18h2v1h-2zM1 19h3v1h-3zM1 20h1v1h-1z"/><path fill="#8b9fd7" d="M21 18h1v1h-1zM19 19h4v1h-4zM17 20h4v1h-4zM17 21h1v1h-1z"/><path fill="#3da0c8" d="M27 19h1v1h-1zM26 20h1v1h-1zM29 21h1v1h-1zM28 22h1v1h-1z"/><path fill="#ff3d9a" d="M2 20h2v1h-2zM1 21h3v1h-3zM2 22h2v1h-2z"/><path fill="#d85eae" d="M4 20h2v1h-2zM4 21h7v1h-7zM4 22h7v1h-7z"/><path fill="#b17fc2" d="M16 20h1v1h-1zM11 21h6v1h-6zM11 22h4v1h-4z"/><path fill="#ffffff" d="M27 20h2v1h-2zM27 21h1v1h-1z"/><path fill="#d2f5ff" d="M28 21h1v1h-1z"/></svg><span><b>COBALT GAMEHUB</b> <small>By Ruan</small></span></div>
  <div class="trophy">🏆</div>
  <h1 id="title"></h1>
  <p id="lead"></p>
  <form class="card" id="codeBox" hidden><label for="code" id="codeLabel"></label>
    <div class="coderow"><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"><button id="codeGo"></button></div>
    <span class="bad" id="codeErr"></span></form>
  <form class="card" id="login" hidden>
    <div class="field"><label for="user" id="userLabel"></label><input id="user" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
    <div class="field"><label for="pass" id="passLabel"></label><input id="pass" type="password" autocomplete="current-password"></div>
    <span class="bad" id="err"></span>
    <button class="pick" id="go"></button>
  </form>
  <div class="card" id="done" hidden></div>
  <p class="small" id="note"></p>
</div>
<script>
'use strict';
const ES = /^es\b/i.test(navigator.language || '');
const T = ES ? {
  title: 'Entra en RetroAchievements', lead: 'Con tu cuenta gratis, GameHub en la TV gana logros en cada juego y los guarda en la nube.',
  user: 'Usuario', pass: 'Contraseña', go: 'Entrar', wait: 'Entrando…',
  code: 'Escribe el código de 6 números que aparece en la TV.', codeGo: 'Seguir', wrong: 'Código incorrecto. Revísalo en la TV.',
  key: 'Este link ya no vale. En la TV, abre Logros → Entrar otra vez y lee el código QR nuevo.',
  bad: 'Usuario o contraseña incorrectos.', offline: 'La TV no pudo conectarse a RetroAchievements. Revisa el internet de la TV.', fail: 'No se pudo entrar. Inténtalo de nuevo.',
  done: '¡Listo, {u}! La TV ya entró en tu cuenta. Puedes cerrar esta página.',
  note: 'La contraseña va solo a la TV, que guarda únicamente una clave de acceso de la cuenta. ¿No tienes cuenta? Créala gratis en <a href="https://retroachievements.org/createaccount" target="_blank" rel="noopener">retroachievements.org</a>.',
} : {
  title: 'Entre no RetroAchievements', lead: 'Com a sua conta grátis, o GameHub da TV ganha conquistas em cada jogo e guarda tudo na nuvem.',
  user: 'Usuário', pass: 'Senha', go: 'Entrar', wait: 'Entrando…',
  code: 'Digite o código de 6 números que aparece na TV.', codeGo: 'Continuar', wrong: 'Código errado. Confira na TV.',
  key: 'Este link não vale mais. Na TV, abra Conquistas → Entrar de novo e leia o QR code novo.',
  bad: 'Usuário ou senha errados.', offline: 'A TV não conseguiu falar com o RetroAchievements. Confira a internet da TV.', fail: 'Não deu para entrar. Tente de novo.',
  done: 'Pronto, {u}! A TV já entrou na sua conta. Pode fechar esta página.',
  note: 'A senha vai só para a TV, que guarda apenas uma chave de acesso da conta. Não tem conta? Crie grátis em <a href="https://retroachievements.org/createaccount" target="_blank" rel="noopener">retroachievements.org</a>.',
};
const $ = s => document.querySelector(s);
let KEY = (location.hash.match(/k=([0-9a-f]{32})/) || [])[1] || '';
$('#title').textContent = T.title; $('#lead').textContent = T.lead; $('#note').innerHTML = T.note;
$('#codeLabel').textContent = T.code; $('#codeGo').textContent = T.codeGo;
$('#userLabel').textContent = T.user; $('#passLabel').textContent = T.pass; $('#go').textContent = T.go;
function showLogin() { $('#codeBox').hidden = true; $('#login').hidden = false; $('#user').focus(); }
if (KEY) showLogin(); else { $('#codeBox').hidden = false; $('#code').focus(); }
$('#codeBox').addEventListener('submit', e => {
  e.preventDefault();
  const c = $('#code').value.replace(/\D/g, '');
  if (c.length !== 6) { $('#codeErr').textContent = T.wrong; return; }
  fetch('/api/info', { headers: { 'x-key': c } }).then(r => r.ok ? r.json() : Promise.reject()).then(s => {
    KEY = s.k; history.replaceState(null, '', '/ra#k=' + KEY); showLogin();
  }).catch(() => { $('#codeErr').textContent = T.wrong; });
});
$('#login').addEventListener('submit', e => {
  e.preventDefault();
  const user = $('#user').value.trim(), pass = $('#pass').value;
  if (!user || !pass) return;
  $('#go').disabled = true; $('#go').textContent = T.wait; $('#err').textContent = '';
  fetch('/api/ra-login', { method: 'POST', headers: { 'x-key': KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ user, pass }) })
    .then(r => r.status === 403 ? Promise.reject('key') : r.json())
    .then(r => {
      if (r.ok) {
        $('#login').hidden = true; $('#lead').hidden = true;
        $('#done').hidden = false; $('#done').textContent = T.done.replace('{u}', r.user || user);
        return;
      }
      $('#err').textContent = r.error === 'senha' ? T.bad : r.error === 'offline' ? T.offline : T.fail;
    })
    .catch(x => { $('#err').textContent = x === 'key' ? T.key : T.fail; })
    .finally(() => { $('#go').disabled = false; $('#go').textContent = T.go; $('#pass').value = ''; });
});
</script>
</body>
</html>
