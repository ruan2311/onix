<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cobalt GameHub</title>
<link rel="stylesheet" href="common.css">
<style>
.app{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;padding:3rem 4.4rem 0}
header{display:flex;align-items:center;justify-content:space-between;gap:1.4rem;flex:none;height:4.6rem}
nav{display:flex;gap:.5rem;flex:none;margin:1rem 0 0 -.4rem}
nav .tab{height:3.4rem;padding:0 .9rem;border-radius:999rem;font-size:1.25rem;white-space:nowrap;font-weight:600;color:var(--dim);display:flex;align-items:center;gap:.6rem}
nav .tab .dot{width:.7rem;height:.7rem}
nav .tab svg{width:1.6rem;height:1.6rem}

nav .tab.cur{color:var(--ink);background:rgba(255,255,255,.08)}
nav .tab.focus{background:rgba(255,255,255,.14);color:var(--ink)}
.right{display:flex;align-items:center;gap:.6rem}
.store-chip .mini{width:3.2rem;height:.45rem;border-radius:99rem;background:rgba(255,255,255,.12);overflow:hidden;display:block}
.store-chip .mini i{display:block;height:100%;background:var(--grad)}
.store-chip.low{color:#ffd27a;border-color:rgba(255,210,122,.35)}
.covers-chip.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(-360deg)}}
.clock{font-size:1.4rem;font-weight:600;color:var(--dim);text-align:right}
.right{flex:none}
main{flex:1;position:relative;overflow:hidden;margin-top:1rem}
.page{position:absolute;top:0;right:0;bottom:0;left:0;overflow:hidden;padding:1rem .8rem 4rem}
.page[hidden]{display:none}
.row-title{font-size:1.45rem;font-weight:700;margin:2.2rem 0 1.1rem .2rem;display:flex;align-items:baseline;gap:1rem}
.row-title small{font-size:1.05rem;color:var(--mute);font-weight:500}
.row{display:flex;gap:1.6rem;overflow:visible;padding:.4rem .2rem}
.tile{flex:none;width:11.6rem;display:flex;flex-direction:column;gap:.7rem;border-radius:var(--r);will-change:transform}
.ctile{will-change:transform}
.tile .name{font-size:1.15rem;font-weight:600;line-height:1.25;max-height:2.9rem;overflow:hidden;color:var(--dim)}
.tile.focus .name{color:var(--ink)}

/* Destaque "Continuar jogando" */
.hero{position:relative;overflow:hidden;display:flex;gap:2.8rem;align-items:center;padding:2rem 2.6rem;border-radius:1.8rem;height:21rem;
  background:linear-gradient(110deg,rgba(255,61,154,.14),rgba(61,225,255,.06) 60%,rgba(255,255,255,.03));border:1px solid var(--line)}
/* Fundo com as cores da própria capa, bem desfocadas */
.hero .ambient{position:absolute;top:-25%;right:-25%;bottom:-25%;left:-25%;width:150%;height:150%;object-fit:cover;filter:blur(3.5rem) saturate(1.3);opacity:.42;z-index:0;pointer-events:none}
.hero .poster{flex:none;height:100%;aspect-ratio:3/4;position:relative;z-index:1;box-shadow:0 1.2rem 3rem rgba(0,0,0,.55);border-radius:1.1rem}
.hero .poster .cover{position:absolute;top:0;right:0;bottom:0;left:0;aspect-ratio:auto;border-radius:1.1rem}
.hero .where{flex:none;margin-left:auto;height:78%;aspect-ratio:4/3;position:relative;z-index:1;display:flex;flex-direction:column;gap:.6rem}
.hero .where img{flex:1;min-height:0;width:100%;object-fit:cover;border-radius:1rem;image-rendering:pixelated;background:#000;box-shadow:0 1rem 2.4rem rgba(0,0,0,.5)}
.hero .where small{font-size:1rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:700}
.hero .info{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;gap:.9rem;min-width:0;flex:1}
.hero .kicker{font-size:1.1rem;letter-spacing:.24em;text-transform:uppercase;color:var(--cyan);font-weight:700}
.hero h1{font-size:3rem;font-weight:800;line-height:1.08;max-height:6.6rem;overflow:hidden}
.hero .meta{font-size:1.25rem;color:var(--dim)}
.hero .acts{display:flex;gap:1rem;margin-top:.8rem}

.consoles{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6rem}
.ctile{height:12rem;border-radius:1.6rem;padding:1.6rem 1.8rem;display:flex;flex-direction:column;justify-content:space-between;
  background:var(--glass);border:1px solid var(--line);overflow:hidden}
.ctile svg{width:7rem;height:4.4rem;opacity:.95}
.ctile b{font-size:1.5rem;display:block}
.ctile small{font-size:1.1rem;color:var(--dim)}

.empty{display:flex;flex-direction:column;align-items:flex-start;gap:1.2rem;padding:3rem;border-radius:1.8rem;max-width:62rem;
  background:var(--glass);border:1px solid var(--line);margin-top:1rem}
.empty h1{font-size:2.6rem;font-weight:800}
.empty p{font-size:1.35rem;color:var(--dim);line-height:1.45}

/* Página do console */
.ghead{display:flex;align-items:center;gap:1.4rem;margin:.4rem 0 1.4rem}
.ghead h1{font-size:2.4rem;font-weight:800}
.ghead .count{color:var(--dim);font-size:1.3rem}
.ghead .sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2rem 1.6rem;padding:.4rem .2rem}
.grid .tile{width:auto}

/* Jogo (painel) */
.sheet.gsheet{flex-direction:row;gap:2.6rem;width:78rem;max-width:78rem}
.gsheet .cv{flex:none;width:20rem}
.gsheet .col{flex:1;display:flex;flex-direction:column;gap:1.2rem;min-width:0}
.gsheet h2{font-size:2.4rem;line-height:1.1}
.gsheet .acts{display:flex;flex-wrap:wrap;gap:.8rem}
.gsheet .list{max-height:30rem}

/* Adicionar jogos */
.add{display:flex;gap:3.2rem;align-items:flex-start}
.qrbox{flex:none;width:28rem;padding:1.8rem;border-radius:1.8rem;background:#fff}
.qrbox svg{width:100%;height:auto}
.add .col{flex:1;display:flex;flex-direction:column;gap:1.2rem;min-width:0}
.add h1{font-size:2.6rem;font-weight:800}
.add p{font-size:1.3rem;color:var(--dim);line-height:1.45}
.add .url{font-size:1.35rem;color:var(--cyan);font-weight:600}
.add .code{font-size:1.7rem;letter-spacing:.3em;color:var(--ink);font-variant-numeric:tabular-nums}
.xfers{display:flex;flex-direction:column;gap:.7rem;margin-top:.6rem}
.cover .usbtag{position:absolute;left:.7rem;bottom:.7rem;height:1.7rem;padding:0 .6rem;border-radius:999rem;font-size:.8rem;font-weight:800;letter-spacing:.06em;display:flex;align-items:center;background:rgba(10,6,24,.82);color:var(--cyan);border:1px solid rgba(61,225,255,.45)}
.usb{padding:1.3rem 1.6rem;border-radius:1.2rem;background:var(--glass);border:1px solid var(--line);display:flex;flex-direction:column;gap:.7rem}
.usb .top{display:flex;gap:.8rem;align-items:center;font-size:1.45rem}
.usb .top svg{width:1.9rem;height:1.9rem;color:var(--cyan)}
.usb p{white-space:pre-line}
.add .usb p.sub{font-size:1.1rem;color:var(--mute)}
.usb .acts{display:flex;flex-wrap:wrap;gap:1rem}
.usb.warn{border-color:rgba(255,138,165,.55);background:rgba(255,80,120,.08)}
.usb.warn .top svg{color:#ff8aa5}
.usbpath{font-size:1.2rem!important;color:var(--cyan)!important;word-break:break-all}
.item.req{align-items:flex-start}
.item.req .grow{font-weight:700}
.item.req .sub{display:block;font-weight:400;margin-top:.3rem;line-height:1.4}
.xfer{padding:1rem 1.4rem;border-radius:1rem;background:var(--glass);display:flex;flex-direction:column;gap:.6rem;font-size:1.2rem}
.xfer .top{display:flex;gap:1rem;align-items:center}
.xfer .top b{flex:1;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.xfer .ok{color:#7ef0b0}.xfer .err{color:#ff8aa5}
.store{padding:1.4rem 1.6rem;border-radius:1.2rem;background:var(--glass);display:flex;flex-direction:column;gap:.8rem}
.store .legend{display:flex;gap:1.8rem;font-size:1.1rem;color:var(--dim);flex-wrap:wrap}
.store .parts{display:flex;gap:1.4rem;font-size:1.05rem;color:var(--mute);flex-wrap:wrap}
.store .parts b{color:var(--text,#fff);font-weight:600}
.store .btn{align-self:flex-start}
.store .legend i{display:inline-block;width:.9rem;height:.9rem;border-radius:.3rem;margin-right:.5rem;vertical-align:-.05rem}

/* Configurações */
/* Cada coluna rola sozinha (a página não), com folga para o contorno do foco não ser cortado. */
.page.set{padding-bottom:1rem}
.settings{display:flex;gap:1.8rem;height:100%}
.settings .menu{flex:none;width:22rem;display:flex;flex-direction:column;gap:.45rem;overflow:hidden;padding:.7rem}
.settings .menu .item{font-weight:600;min-height:3.6rem;flex:none}
.settings .menu .item.cur{background:rgba(255,255,255,.08)}
.settings .body{flex:1;min-width:0;overflow:hidden;padding:.7rem .7rem 2rem;margin:0}
.settings .body h2{font-size:2rem;font-weight:800;margin-bottom:.4rem}
.settings .body .hint{font-size:1.15rem;color:var(--mute);margin-bottom:1rem}
.scopes{display:flex;gap:.6rem;margin:.4rem 0 1rem}
.credits{font-size:1.2rem;color:var(--dim);line-height:1.6}
.pnum{flex:none;width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.2rem;background:var(--grad);color:#14082c}
.pnum.big{width:4.4rem;height:4.4rem;font-size:2.2rem}

/* Abertura (2,4 s): uma linha de luz cruza a tela e "liga" a imagem como numa TV antiga, a marca
   surge girando com um anel de energia, as letras sobem uma a uma, um traço neon passa embaixo e
   tudo se abre para o hub. Só transform e opacity: leve até em TV lenta. */
.boot{position:fixed;top:0;right:0;bottom:0;left:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center;pointer-events:none;
  overflow:hidden;animation:bootout .5s cubic-bezier(.4,0,.2,1) 1.9s forwards}
.boot .glow{position:absolute;top:0;right:0;bottom:0;left:0;opacity:0;background:radial-gradient(48% 42% at 50% 50%,rgba(139,108,240,.34),rgba(255,61,154,.08) 50%,transparent 76%);
  animation:bootglow 1.3s ease .45s forwards}
.boot .line{position:absolute;left:12%;right:12%;top:50%;height:.25rem;margin-top:-.125rem;background:var(--grad);transform:scaleX(0);
  box-shadow:0 0 1.6rem rgba(255,61,154,.7),0 0 3rem rgba(61,225,255,.45);
  animation:bootline .6s cubic-bezier(.65,0,.25,1) forwards,bootfade .2s ease .55s forwards}
.boot .flash{position:absolute;left:0;right:0;top:50%;height:70vh;margin-top:-35vh;opacity:0;transform:scaleY(.004);
  background:radial-gradient(50% 50% at 50% 50%,rgba(255,236,250,.42),rgba(255,61,154,.22) 22%,rgba(139,108,240,.18) 45%,rgba(61,225,255,.06) 62%,transparent 74%);
  animation:bootflash .55s cubic-bezier(.2,.8,.2,1) .48s forwards}
.boot .brand{position:relative;gap:1.6rem;animation:bootbrandout .3s cubic-bezier(.4,0,1,1) 1.72s forwards}
@keyframes bootbrandout{to{opacity:0;transform:scale(1.12)}}
.boot .mk{position:relative;flex:none;display:block}
.boot .mk svg{width:6rem;height:6rem;opacity:0;transform:scale(.4) rotate(-20deg);animation:bootmark .75s cubic-bezier(.2,1.5,.4,1) .55s forwards}
.boot .mk .ring{position:absolute;top:-45%;right:-45%;bottom:-45%;left:-45%;border-radius:50%;border:.2rem solid rgba(61,225,255,.85);opacity:0;transform:scale(.3);
  box-shadow:0 0 1.4rem rgba(61,225,255,.5),inset 0 0 1.4rem rgba(255,61,154,.35);animation:bootring .9s cubic-bezier(.1,.6,.3,1) .62s forwards}
.boot .brand>span{position:relative}
.boot .brand b{font-size:2.4rem}
.boot .brand b i{display:inline-block;font-style:normal;opacity:0;transform:translateY(.8em);
  animation:bootletter .55s cubic-bezier(.2,.9,.3,1.25) forwards;animation-delay:calc(.8s + var(--i) * .045s)}
.boot .brand small{font-size:1.3rem;opacity:0;transform:translateX(-.8rem);animation:bootsub .5s ease 1.35s forwards}
.boot .brand .bar{position:absolute;left:0;right:0;bottom:-1rem;height:.2rem;border-radius:9rem;background:var(--grad);transform:scaleX(0);transform-origin:left;
  box-shadow:0 0 1rem rgba(255,61,154,.6);animation:bootbar .8s cubic-bezier(.65,0,.25,1) 1.2s forwards}
@keyframes bootline{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes bootflash{0%{opacity:0;transform:scaleY(.004)}25%{opacity:1}100%{opacity:0;transform:scaleY(1)}}
@keyframes bootglow{0%{opacity:0}100%{opacity:1}}
@keyframes bootmark{0%{opacity:0;transform:scale(.4) rotate(-20deg)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes bootring{0%{opacity:0;transform:scale(.3)}25%{opacity:1}100%{opacity:0;transform:scale(1.7)}}
@keyframes bootletter{to{opacity:1;transform:none}}
@keyframes bootsub{to{opacity:1;transform:none}}
@keyframes bootbar{0%{transform:scaleX(0);opacity:1}70%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:.55}}
@keyframes bootout{0%{opacity:1;transform:none}100%{opacity:0;transform:scale(1.08);visibility:hidden}}
@keyframes bootfade{to{opacity:0}}   /* a linha some quando a imagem "liga" */
/* Só começa depois do primeiro quadro na tela (classe "go"): numa TV lenta, o começo não se perde. */
.boot,.boot *{animation-play-state:paused!important}
.boot.go,.boot.go *{animation-play-state:running!important}
/* Enquanto a abertura toca, as animações do hub esperam (disputavam a placa de vídeo e a
   abertura engasgava); elas começam quando a abertura se desfaz. */
html.booting.pc body::before,html.booting .page,html.booting .row .tile{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.boot{display:none}}

/* ---------------- PC ----------------
   Mais movimento que na TV: as páginas entram deslizando, os cartões sobem com o mouse, as capas
   ganham um brilho que passa, o fundo tem uma aurora lenta e as janelas surgem com um leve
   impulso. "Animações" desligado (html.no-motion) desliga tudo, como na TV. */
html.pc body::before{content:"";position:fixed;top:-20%;right:-20%;bottom:-20%;left:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 35% at 20% 25%,rgba(255,111,181,.13),transparent 70%),radial-gradient(45% 40% at 80% 70%,rgba(90,216,255,.11),transparent 70%);
  animation:pcAurora 26s ease-in-out infinite alternate}
@keyframes pcAurora{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(4%,-3%) rotate(3deg)}100%{transform:translate(-3%,4%) rotate(-2deg)}}
html.pc .page{overflow-y:auto;scrollbar-width:none;animation:pcPage .5s cubic-bezier(.2,.8,.2,1)}
html.pc .page::-webkit-scrollbar{display:none}
/* Configurações: o menu e o conteúdo rolam com a roda do mouse (na TV, só o foco rola). */
html.pc .settings .menu,html.pc .settings .body{overflow-y:auto}
@keyframes pcPage{from{opacity:0;transform:translateY(1.4rem) scale(.985)}}
html.pc .tile,html.pc .ctile,html.pc .btn,html.pc .tab{transition:transform .3s cubic-bezier(.2,.9,.3,1.25),box-shadow .3s,background-color .2s,color .2s}
html.pc .tile:hover{transform:translateY(-.4rem) scale(1.03);z-index:2}
html.pc .ctile:hover{transform:translateY(-.3rem) scale(1.02)}
html.pc .btn:hover,html.pc .tab:hover{transform:translateY(-.12rem)}
html.pc .tile .cover::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);
  transform:translateX(-120%);pointer-events:none}
html.pc .tile.focus .cover::after,html.pc .tile:hover .cover::after{animation:pcShine .9s ease}
@keyframes pcShine{to{transform:translateX(120%)}}
html.pc .row .tile{animation:pcRise .55s cubic-bezier(.2,.8,.2,1) both}
html.pc .row .tile:nth-child(2){animation-delay:.04s}html.pc .row .tile:nth-child(3){animation-delay:.08s}
html.pc .row .tile:nth-child(4){animation-delay:.12s}html.pc .row .tile:nth-child(5){animation-delay:.16s}
html.pc .row .tile:nth-child(6){animation-delay:.2s}html.pc .row .tile:nth-child(n+7){animation-delay:.24s}
@keyframes pcRise{from{opacity:0;transform:translateY(1.2rem)}}
html.pc .hero .ambient{animation:pcBreath 10s ease-in-out infinite alternate}
@keyframes pcBreath{from{transform:scale(1)}to{transform:scale(1.1) rotate(1deg)}}
html.pc .layer .sheet{animation:pcSheet .38s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pcSheet{from{opacity:0;transform:translateY(1.2rem) scale(.96)}}
html.pc .f{cursor:pointer}
.addpc{display:grid;grid-template-columns:1.25fr 1fr;gap:3rem;align-items:start}
.addpc .col{display:flex;flex-direction:column;gap:1.1rem}
.addpc h1{font-size:2.6rem;font-weight:800}
.addpc p{font-size:1.2rem;color:var(--dim);line-height:1.5}
.addpc .acts{display:flex;flex-wrap:wrap;gap:1rem}
.addpc .list .item{font-size:1.1rem;word-break:break-all}

/* ---------------- Celular, em pé ----------------
   Uma coluna: topo compacto, abas que rolam de lado, páginas que rolam com o dedo. */
html.mobile .app{padding:.9rem .9rem 0}
html.mobile header{height:auto;gap:.6rem}
html.mobile .brand{gap:.6rem}
html.mobile .brand svg{width:2.2rem;height:2.2rem}
html.mobile .brand>span{gap:.5rem}
html.mobile .brand b{font-size:.95rem;letter-spacing:.24em}
html.mobile .brand small{display:none}
html.mobile header{flex-wrap:nowrap}
html.mobile .brand{min-width:0;flex:1}
html.mobile .brand>span{min-width:0}
html.mobile .brand b{overflow:hidden;text-overflow:ellipsis}
html.mobile .clock,html.mobile #profileChip,html.mobile .store-chip .mini{display:none}
html.mobile .right{gap:.4rem}
html.mobile nav{overflow-x:auto;margin:.7rem -.9rem 0;padding:0 .9rem;scrollbar-width:none}
html.mobile nav::-webkit-scrollbar{display:none}
html.mobile nav .tab{height:2.6rem;font-size:1rem;flex:none;padding:0 .8rem}
html.mobile nav .tab svg{width:1.3rem;height:1.3rem}
html.mobile main{overflow-y:auto;margin-top:.5rem;-webkit-overflow-scrolling:touch}
html.mobile .page{position:relative;top:auto;right:auto;bottom:auto;left:auto;overflow:visible;padding:.3rem 0 3rem}
html.mobile .row-title{font-size:1.1rem;margin:1.4rem 0 .6rem}
html.mobile .row{overflow-x:auto;margin:0 -.9rem;padding:.3rem .9rem;gap:.8rem;scrollbar-width:none}
html.mobile .row::-webkit-scrollbar{display:none}
html.mobile .tile{width:7.6rem;gap:.45rem}
html.mobile .tile .name{font-size:.85rem;max-height:2.2rem}
html.mobile .hero{flex-wrap:wrap;height:auto;padding:1.1rem;gap:1rem;border-radius:1.3rem}
html.mobile .hero .poster{height:9.5rem}
html.mobile .hero .where{display:none}
html.mobile .hero .info{min-width:12rem;gap:.5rem}
html.mobile .hero .kicker{font-size:.72rem}
html.mobile .hero h1{font-size:1.45rem;max-height:none}
html.mobile .hero .meta{font-size:.85rem}
html.mobile .hero .acts{flex-wrap:wrap;gap:.6rem;margin-top:.4rem}
html.mobile .consoles{grid-template-columns:1fr 1fr;gap:.8rem}
html.mobile .ctile{height:7.4rem;padding:1rem;border-radius:1.2rem}
html.mobile .ctile svg{width:4.4rem;height:2.8rem}
html.mobile .ctile b{font-size:1rem}
html.mobile .ctile small{font-size:.8rem}
html.mobile .empty{padding:1.4rem;gap:.9rem;border-radius:1.3rem}
html.mobile .empty h1{font-size:1.4rem}
html.mobile .empty p{font-size:1rem}
html.mobile .ghead{flex-wrap:wrap;gap:.6rem;margin:.2rem 0 1rem}
html.mobile .ghead>span:first-child{width:3.4rem!important}
html.mobile .ghead h1{font-size:1.4rem}
html.mobile .ghead .count{font-size:.9rem}
html.mobile .ghead .sp{flex-basis:100%;height:0}
html.mobile .grid{grid-template-columns:repeat(3,1fr);gap:1rem .7rem;padding:.2rem 0}
html.mobile .sheet.gsheet{flex-direction:column;width:auto;max-width:34rem;gap:1rem}
html.mobile .gsheet .cv{width:7.5rem}
html.mobile .gsheet h2{font-size:1.4rem}
html.mobile .gsheet .list{max-height:none}
html.mobile .settings{flex-direction:column;height:auto;gap:.8rem}
html.mobile .settings .menu{width:auto;flex-direction:row;overflow-x:auto;margin:0 -.9rem;padding:.2rem .9rem;scrollbar-width:none}
html.mobile .settings .menu::-webkit-scrollbar{display:none}
html.mobile .settings .menu .item{min-height:2.6rem;flex:none;white-space:nowrap;padding:.4rem .9rem}
html.mobile .settings .body{overflow:visible;padding:0}
html.mobile .settings .body h2{font-size:1.4rem}
html.mobile .settings .body .hint{font-size:.85rem}
html.mobile .store .legend{font-size:.85rem;gap:.8rem}
html.mobile .addm{display:flex;flex-direction:column;gap:1rem}
html.mobile .addm h1{font-size:1.5rem;font-weight:800}
html.mobile .addm p{font-size:1rem;color:var(--dim);line-height:1.45}
html.mobile .addm .acts{display:flex;flex-direction:column;gap:.7rem}
html.mobile .addm .acts .btn{justify-content:center;height:3.3rem}
html.mobile .xfer{font-size:.9rem}
html.mobile .boot .brand{flex:none;max-width:92vw;flex-direction:column;gap:1.6rem}   /* a marca do topo estica (flex:1); a da abertura fica no centro */
html.mobile .boot .brand>span{flex-direction:column;align-items:center;gap:.5rem}   /* em pé: a marca em cima, o nome embaixo (o anel cabia mal ao lado) */
html.mobile .boot .brand b{overflow:visible}
html.mobile .boot .brand .bar{bottom:-.8rem}
html.mobile .boot .brand small{display:inline}
html.mobile .boot .brand svg{width:4.6rem;height:4.6rem}
html.mobile .boot .brand b{font-size:1.25rem}
html.mobile .boot .brand small{font-size:.8rem}
html.mobile .pnum{width:2rem;height:2rem;font-size:1rem}
</style>
</head>
<body>
<div class="bg"></div>
<div class="boot" id="boot"><div class="glow"></div><div class="flash"></div><div class="line"></div><div class="brand" id="bootBrand"></div></div>
<div class="app">
  <header>
    <div class="brand" id="brand"></div>
    <div class="right">
      <div id="coversChip"></div>
      <div id="storeChip"></div>
      <div id="padChip"></div>
      <div class="chip" id="profileChip" hidden></div>
      <div class="clock" id="clock"></div>
    </div>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script src="common.js"></script>
<script>
'use strict';
const Hub = window.Hub || window.OnixHub || (window.parent !== window && window.parent.OnixHub) || null;   // TV: ponte Java; PC: preload do Electron; iPhone: shell.js
let INFO = {}, LIB = [], PAGE = 'home', sortBy = 'az', uploading = {}, uploadInfo = null;

function call(name, ...args) {
  try { return Hub ? Hub[name](...args) : null; } catch (e) { return null; }
}
function json(s, def) { try { return s ? JSON.parse(s) : def; } catch (_) { return def; } }

function brand(el) {
  el.replaceChildren(svg(MARK), h('span', null, h('b', { text: 'COBALT GAMEHUB' }), h('small', { text: 'By Ruan' })));
}

function loadLibrary() { LIB = json(call('library'), []); }

/* ---------------- Topo ---------------- */
const TABS = () => [
  { id: 'home', label: t('Início') },
  ...CONSOLES.map(c => ({ id: 'console:' + c.id, label: c.id === 'md' && CONSOLES.length <= 8 ? 'Mega Drive' : t(c.short), color: c.color })),
  ...(INFO.kids ? [] : [{ id: 'add', label: t('Adicionar jogos'), icon: 'plus' }, { id: 'settings', label: t('Configurações'), icon: 'gear' }]),
];
function renderNav() {
  $('#nav').replaceChildren(...TABS().map(tb => {
    const b = h('button', { class: 'f tab pill' + (PAGE === tb.id ? ' cur' : '') },
      tb.color ? h('span', { class: 'dot', style: { background: tb.color } }) : null, tb.icon ? icon(tb.icon) : tb.label);
    if (tb.icon) b.setAttribute('aria-label', tb.label);
    b._act = () => show(tb.id);
    b.dataset.tab = tb.id;
    return b;
  }));
}
function renderChips() {
  renderStore();
  // Atualizar capas, ao lado do armazenamento (o ícone gira enquanto baixa).
  $('#coversChip').replaceChildren(...(INFO.kids ? [] : [h('button', { class: 'f chip pill covers-chip' + (coversBusy ? ' busy' : ''),
    title: t('Atualizar capas'), 'aria-label': t('Atualizar capas'), act: refreshCovers }, icon('reset'))]));
  const pads = json(call('gamepads'), INFO.gamepads || []);
  const clients = INFO.gamepadClients || 0;
  const chip = pads.length
    ? h('div', { class: 'chip', title: pads.map(p => p.name).join(', ') }, icon('pad'), String(pads.length))
    : clients > 0
      ? h('button', { class: 'f chip ok pill', title: t('{n} celular conectado', { n: clients }), act: () => openConnectPadSheet() }, icon('pad'), t('Celular conectado'))
      : INFO.mobile ? null   // no celular, o controle na tela já joga
        : INFO.pc ? h('div', { class: 'chip', title: t('Teclado: setas, X = A, Z = B, Enter = Start. Esc abre o menu.') }, icon('pad'), t('Teclado'))
        : h('button', { class: 'f chip warn pill', act: () => openConnectPadSheet() }, icon('pad'), t('Celular como controle'));
  $('#padChip').replaceChildren(...(chip ? [chip] : []));
  const p = $('#profileChip');
  if (INFO.profileName) {
    p.hidden = false;
    p.replaceChildren(...[INFO.kids ? icon('kid') : null, INFO.profileName].filter(Boolean));
  } else p.hidden = true;
}
function renderStore() {
  const el = $('#storeChip');
  if (!el) return;
  const s = json(call('storage'), null);
  if (!s || !s.total) { el.replaceChildren(); return; }
  const room = (s.used || 0) + (s.available || 0);
  const pct = room > 0 ? Math.round((s.used || 0) / room * 100) : 100;
  const low = (s.available || 0) < 200 * 1048576;
  const chip = h('button', { class: 'f chip pill store-chip' + (low ? ' low' : ''), title: t('Armazenamento'), act: () => { setSection = 'storage'; show('settings'); } },
    icon('disk'), t('{n} livres', { n: fmtBytes(s.available || 0) }), h('span', { class: 'mini' }, h('i', { style: { width: pct + '%' } })));
  if (INFO.kids) chip.classList.remove('f');
  el.replaceChildren(chip);
}
function tick() {
  const d = new Date();
  $('#clock').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

/* ---------------- Páginas ---------------- */
function show(id, keepFocus) {
  if (PAGE === 'add' && id !== 'add') call('uploadStop');
  PAGE = id;
  renderNav();
  renderStore();   // o espaço livre do topo acompanha o que saiu ou entrou (apagar um jogo, por exemplo)
  const main = $('#main');
  let page;
  if (id === 'home') page = homePage();
  else if (id.startsWith('console:')) page = consolePage(id.slice(8));
  else if (id === 'add') page = addPage();
  else if (id === 'settings') page = settingsPage();
  main.replaceChildren(page);
  if (!keepFocus) {
    const tab = $$('#nav .tab').find(b => b.dataset.tab === id);
    const first = $('.f', page);
    focus(first || tab);
  } else ensureFocus();
}

function tile(g, onAct) {
  const b = h('button', { class: 'f tile' }, coverEl(g), h('span', { class: 'name', text: g.name }));
  b._act = onAct || (() => openGame(g));
  return b;
}

function recent() {
  return LIB.filter(g => g.last).sort((a, b) => b.last - a.last);
}

/* Como pôr jogos na biblioteca: no PC, pela pasta; na TV, pelo celular. */
const emptyHint = () => INFO.web ? 'Abra Adicionar jogos e escolha os arquivos dos seus jogos.' : INFO.pc ? 'Abra Adicionar jogos e escolha a pasta onde estão os seus jogos.' : 'Mande seus jogos pelo celular: abra Adicionar jogos e leia o QR code com a câmera.';
function homePage() {
  const page = h('section', { class: 'page' });
  if (!LIB.length) {
    page.append(INFO.kids
      ? h('div', { class: 'empty' }, h('h1', { text: t('Nenhum jogo liberado ainda') }), h('p', { text: t('Peça para um adulto liberar jogos no GameHub (no jogo, Liberar no Modo Infantil).') }))
      : h('div', { class: 'empty' }, h('h1', { text: t('Sua biblioteca está vazia') }),
        h('p', { text: t(emptyHint()) }),
        h('p', { text: t('Use só jogos que você tem o direito de usar. Nenhum jogo vem com o GameHub.') }),
        h('button', { class: 'f btn primary', act: () => show('add') }, icon('plus'), t('Adicionar jogos'))));
    page.append(h('div', { class: 'row-title', text: t('Consoles') }), consoleTiles());
    return page;
  }
  const rec = recent();
  if (rec.length) {
    const g = rec[0], c = consoleOf(g.console);
    // A capa original (identifica o jogo) na proporção dela, o fundo com as cores dela e, à direita,
    // a tela de onde parou, deitada.
    const poster = h('div', { class: 'poster' }, coverEl(g, { tag: false, title: true }));
    const ambient = g.cover ? h('img', { class: 'ambient', src: 'cover/' + g.id + '.jpg?v=' + (g.coverTried || 0), alt: '' }) : null;
    if (ambient) ambient.onerror = () => ambient.remove();
    let where = null;
    if (g.resume) {
      const img = h('img', { src: 'shot/' + INFO.profile + '/' + g.id + '/auto.jpg?t=' + g.last, alt: '' });
      where = h('div', { class: 'where' }, h('small', { text: t('Onde parou') }), img);
      img.onerror = () => where.remove();
    }
    const play = h('button', { class: 'f btn primary', act: () => play_(g, g.resume ? 'resume' : 'new') }, icon('play'), g.resume ? t('Continuar') : t('Jogar'));
    page.append(h('div', { class: 'hero' }, ambient, poster, h('div', { class: 'info' },
      h('div', { class: 'kicker', text: t('Continuar jogando') }),
      h('h1', { text: g.name }),
      h('div', { class: 'meta' }, h('span', { style: { color: c.color }, text: t(c.name) }), ' · ', ago(g.last), ' · ', t('Jogado por {t}', { t: fmtTime(g.time) })),
      h('div', { class: 'acts' }, play, consoleOf(g.console).ra ? null : h('button', { class: 'f btn', act: () => openGame(g), text: t('Estados salvos') }))), where));
    if (rec.length > 1) page.append(h('div', { class: 'row-title', text: t('Jogados recentemente') }), h('div', { class: 'row' }, rec.slice(1, 9).map(x => tile(x))));
  }
  const favs = LIB.filter(g => g.fav);
  if (favs.length) page.append(h('div', { class: 'row-title', text: t('Favoritos') }), h('div', { class: 'row' }, favs.slice(0, 12).map(x => tile(x))));
  page.append(h('div', { class: 'row-title', text: t('Consoles') }), consoleTiles());
  const added = LIB.slice().sort((a, b) => b.added - a.added).slice(0, 12);
  page.append(h('div', { class: 'row-title', text: t('Adicionados recentemente') }), h('div', { class: 'row' }, added.map(x => tile(x))));
  return page;
}

/* Os formatos aceitos (o PC também abre discos de PS1; a TV, Atari e fliperama). */
const formatsText = () => (CONSOLES.some(c => c.id === 'arcade') && CONSOLES.some(c => c.id === 'gc')
  ? t('Formatos: .nes, .sfc, .smc, .gba, .gbc, .gb, .md, .gen, .bin e .zip; PlayStation: .chd, .pbp ou .cue (com os .bin); Atari: .a26 e .a78; Fliperama: o .zip com o nome do jogo (como sf2.zip); N64: .z64, .n64 e .v64; DS: .nds; PSP: .iso e .cso; GameCube e Wii: .iso, .rvz, .gcz, .wbfs e .gcm; PS2: .iso e .chd (e o .bin da BIOS do seu PS2)')
  : CONSOLES.some(c => c.id === 'arcade') && CONSOLES.some(c => c.id === 'n64')
  ? t('Formatos: .nes, .sfc, .smc, .gba, .gbc, .gb, .md, .gen, .bin e .zip; PlayStation: .chd, .pbp ou .cue (com os .bin); Atari: .a26 e .a78; Fliperama: o .zip com o nome do jogo (como sf2.zip); N64: .z64, .n64 e .v64; DS: .nds; PSP: .iso e .cso')
  : CONSOLES.some(c => c.id === 'arcade')
  ? t('Formatos: .nes, .sfc, .smc, .gba, .gbc, .gb, .md, .gen, .bin e .zip; PlayStation: .chd, .pbp ou .cue (com os .bin); Atari: .a26 e .a78; Fliperama: o .zip com o nome do jogo (como sf2.zip)')
  : CONSOLES.some(c => c.ra)
  ? t('Formatos: .nes, .sfc, .smc, .gba, .gbc, .gb, .md, .gen, .bin e .zip; PlayStation: .cue (com os .bin), .chd e .pbp; N64: .z64, .n64 e .v64; DS: .nds; PSP: .iso e .cso; GameCube e Wii: .iso, .rvz, .gcz, .wbfs e .gcm; PS2: .iso e .chd')
  : CONSOLES.some(c => c.id === 'ps1')
  ? t('Formatos: .nes, .sfc, .smc, .gba, .gbc, .gb, .md, .gen, .bin e .zip; PlayStation: .cue (com os .bin), .chd e .pbp')
  : t('Formatos: .nes, .sfc, .smc, .gba, .md, .gen, .bin e .zip'));

function consoleTiles() {
  // Mais de 4 consoles (PC, com o PS1): todos numa linha só.
  // Com 8 (TV): 4 por linha; com mais (PC com os consoles do RetroArch): 6 por linha.
  const cols = CONSOLES.length === 8 ? 4 : CONSOLES.length > 6 ? 6 : CONSOLES.length;
  // No celular, sempre 2 por linha (o CSS do html.mobile cuida).
  return h('div', { class: 'consoles', style: CONSOLES.length > 4 && !INFO.mobile ? { gridTemplateColumns: 'repeat(' + cols + ',1fr)' } : null }, CONSOLES.map(c => {
    const n = LIB.filter(g => g.console === c.id).length;
    const b = h('button', { class: 'f ctile', style: { background: 'linear-gradient(150deg,' + c.color + '2e,rgba(255,255,255,.03) 70%)' } },
      h('span', { style: { color: c.color } }, svg(CONSOLE_ART[c.id])),
      h('span', null, h('b', { text: t(c.name) }), h('small', { text: n ? n + ' ' + t(n === 1 ? 'jogo' : 'jogos') : t('Nenhum jogo') })));
    b._act = () => show('console:' + c.id);
    return b;
  }));
}

function consolePage(cid) {
  const c = consoleOf(cid);
  const page = h('section', { class: 'page' });
  let games = LIB.filter(g => g.console === cid);
  if (sortBy === 'az') games.sort((a, b) => a.name.localeCompare(b.name));
  else if (sortBy === 'recent') games.sort((a, b) => (b.last || 0) - (a.last || 0) || b.added - a.added);
  else games.sort((a, b) => (b.time || 0) - (a.time || 0));
  const sorts = [['az', t('A–Z')], ['recent', t('Recentes')], ['time', t('Mais jogados')]];
  page.append(h('div', { class: 'ghead' },
    h('span', { style: { color: c.color, width: '6rem' } }, svg(CONSOLE_ART[cid])),
    h('h1', { text: t(c.name) }),
    h('span', { class: 'count', text: games.length ? games.length + ' ' + t(games.length === 1 ? 'jogo' : 'jogos') : '' }),
    h('span', { class: 'sp' }),
    ...sorts.map(([k, label]) => h('button', { class: 'f btn' + (sortBy === k ? ' primary' : ''), text: label, act: () => { sortBy = k; show(PAGE, true); } }))));
  if (!games.length) {
    page.append(h('div', { class: 'empty' }, h('h1', { text: t('Nenhum jogo') }),
      INFO.kids ? h('p', { text: t('Peça para um adulto liberar jogos no GameHub (no jogo, Liberar no Modo Infantil).') })
        : h('p', { text: t(emptyHint()) }),
      INFO.kids ? null : h('button', { class: 'f btn primary', act: () => show('add') }, icon('plus'), t('Adicionar jogos'))));
    return page;
  }
  page.append(h('div', { class: 'grid' }, games.map(g => tile(g))));
  return page;
}

/* ---------------- Jogo ---------------- */
function openGame(g) {
  g = LIB.find(x => x.id === g.id) || g;
  const c = consoleOf(g.console);
  const states = json(call('states', g.id), []);
  const auto = states.find(s => s.slot === 'auto');
  const acts = h('div', { class: 'acts' });
  if (auto) acts.append(h('button', { class: 'f btn primary', act: () => { closeLayer(); play_(g, 'resume'); } }, icon('play'), t('Continuar')));
  acts.append(h('button', { class: 'f btn' + (auto ? '' : ' primary'), act: () => { closeLayer(); play_(g, 'new'); } }, auto ? icon('reset') : icon('play'), auto ? t('Jogar do começo') : t('Jogar')));

  const list = h('div', { class: 'list' });
  const slots = states.filter(s => s.slot !== 'auto');
  if (slots.length) list.append(h('div', { class: 'sep', text: t('Estados salvos') }));
  for (const s of slots) {
    list.append(h('button', { class: 'f item', act: () => { closeLayer(); play_(g, s.slot); } },
      icon('load'), h('span', { class: 'grow' }, t('Espaço {n}', { n: s.slot }), h('span', { class: 'sub', text: ago(s.time) })),
      h('span', { class: 'val', text: t('Carregar') })));
  }
  list.append(h('div', { class: 'sep', text: t('Jogo') }));
  const fav = h('button', { class: 'f item' }, icon(g.fav ? 'star' : 'starOff'), h('span', { class: 'grow', text: g.fav ? t('Tirar dos favoritos') : t('Favorito') }));
  fav._act = () => { call('setFavorite', g.id, !g.fav); loadLibrary(); closeLayer(); show(PAGE, true); openGame(g); };
  list.append(fav);
  if (!INFO.kids) {
    if (consoleOf(g.console).ra) {
      list.append(h('button', { class: 'f item', act: () => raPadSheet(g.console) }, icon('pad'),
        h('span', { class: 'grow' }, t('Controles'), h('span', { class: 'sub', text: t('Tecla do teclado ou botão do controle para cada botão do console.') })), icon('chev')));
      list.append(h('button', { class: 'f item', act: () => raSheet(g.console) }, icon('sliders'), h('span', { class: 'grow', text: t('Configurações do {c}', { c: t(c.name) }) }), icon('chev')));
    } else {
      list.append(h('button', { class: 'f item', act: () => cheatsSheet(g) }, icon('code'), h('span', { class: 'grow', text: t('Trapaças') }), icon('chev')));
      list.append(h('button', { class: 'f item', act: () => scopeSheet('game:' + g.id, g.name, g.console) }, icon('sliders'), h('span', { class: 'grow', text: t('Configurações do jogo') }), icon('chev')));
    }
    const kid = h('button', { class: 'f item' + (g.kids ? ' on' : '') }, icon('kid'), h('span', { class: 'grow', text: t('Liberar no Modo Infantil') }), h('span', { class: 'val', text: g.kids ? t('Liberado') : t('Bloqueado') }));
    kid._act = () => { call('setKids', g.id, !g.kids); g.kids = !g.kids; kid.classList.toggle('on', g.kids); kid.lastChild.textContent = g.kids ? t('Liberado') : t('Bloqueado'); loadLibrary(); };
    list.append(kid);
    list.append(h('button', { class: 'f item', act: () => renameSheet(g) }, icon('edit'), h('span', { class: 'grow', text: t('Renomear') })));
    list.append(h('button', { class: 'f item', act: () => ask(t('Apagar {n}?', { n: g.name }), t(INFO.web ? 'O jogo, os saves e os estados salvos dele saem deste aparelho. Não dá para desfazer.' : INFO.pc ? 'O jogo sai da biblioteca, com os saves e os estados salvos dele. O arquivo continua na pasta do computador.' : g.path ? 'O jogo sai da biblioteca, com os saves e os estados salvos dele. O arquivo continua no pendrive.' : 'O jogo, os saves e os estados salvos dele saem da TV. Não dá para desfazer.'),
      [[t('Apagar'), () => { call('remove', g.id); loadLibrary(); closeAllLayers(); show(PAGE, true); toast(t('Jogo apagado')); }, 'danger'], [t('Cancelar')]]) },
      icon('trash'), h('span', { class: 'grow', text: t('Apagar jogo') })));
  }
  const meta = g.time ? t('Jogado por {t}', { t: fmtTime(g.time) }) + (g.last ? ' · ' + ago(g.last) : '') : t('Ainda não jogado');
  const sheet = h('div', { class: 'sheet gsheet' },
    h('div', { class: 'cv' }, coverEl(g, { title: true })),
    h('div', { class: 'col' },
      h('div', null, h('span', { class: 'chip', style: { color: c.color } }, t(c.name))),
      h('h2', { text: g.name }), h('p', { text: meta }), acts,
      h('div', { class: 'scroll', style: { overflowY: 'auto', maxHeight: '30rem' } }, list)));
  openLayer(h('div', { class: 'layer' }, sheet));
}

function renameSheet(g) {
  const input = h('input', { value: g.name, maxlength: 80, style: { fontSize: '1.6rem', padding: '1rem 1.4rem', borderRadius: '1rem', border: '1px solid var(--line)', background: 'rgba(255,255,255,.06)', width: '100%' } });
  const field = h('button', { class: 'f item', act: () => input.focus() }, input);
  const save = h('button', { class: 'f btn primary', text: t('Salvar'), act: () => {
    if (call('rename', g.id, input.value)) { loadLibrary(); closeAllLayers(); show(PAGE, true); }
  } });
  openLayer(h('div', { class: 'layer' }, h('div', { class: 'sheet' }, h('h2', { text: t('Nome do jogo') }), field,
    h('div', { style: { display: 'flex', gap: '1rem' } }, save, h('button', { class: 'f btn', text: t('Cancelar'), act: closeLayer })))));
  setTimeout(() => input.focus(), 50);
}

function cheatsSheet(g) {
  let list = json(call('cheats', g.id), []);
  const box = h('div', { class: 'list' });
  const draw = () => {
    box.replaceChildren();
    if (!list.length) box.append(h('p', { text: t('Nenhum código ainda.') }));
    list.forEach((c, i) => {
      const it = h('button', { class: 'f item' + (c.on ? ' on' : '') }, icon('code'),
        h('span', { class: 'grow' }, c.desc || c.code, c.desc ? h('span', { class: 'sub', text: c.code }) : null),
        h('span', { class: 'val', text: c.on ? t('Ligado') : t('Desligado') }));
      it._act = () => { c.on = !c.on; call('setCheats', g.id, JSON.stringify(list)); draw(); ensureFocus(box.children[i]); };
      it._right = () => ask(t('Apagar código'), c.code, [[t('Apagar'), () => { list.splice(i, 1); call('setCheats', g.id, JSON.stringify(list)); draw(); ensureFocus(); }, 'danger'], [t('Cancelar')]]);
      box.append(it);
    });
  };
  draw();
  const add = h('button', { class: 'f btn primary', act: () => {
    const desc = h('input', { placeholder: t('Descrição (opcional)'), maxlength: 80, class: 'inp' });
    const code = h('input', { placeholder: t('Código'), maxlength: 200, class: 'inp' });
    for (const i of [desc, code]) Object.assign(i.style, { fontSize: '1.5rem', padding: '1rem 1.4rem', borderRadius: '1rem', border: '1px solid var(--line)', background: 'rgba(255,255,255,.06)', width: '100%' });
    openLayer(h('div', { class: 'layer' }, h('div', { class: 'sheet' }, h('h2', { text: t('Novo código') }),
      h('button', { class: 'f item', act: () => code.focus() }, code),
      h('button', { class: 'f item', act: () => desc.focus() }, desc),
      h('div', { style: { display: 'flex', gap: '1rem' } },
        h('button', { class: 'f btn primary', text: t('Salvar'), act: () => {
          if (!code.value.trim()) return;
          list.push({ code: code.value.trim(), desc: desc.value.trim(), on: true });
          call('setCheats', g.id, JSON.stringify(list)); closeLayer(); draw(); ensureFocus();
        } }),
        h('button', { class: 'f btn', text: t('Cancelar'), act: closeLayer })))));
  } }, icon('plus'), t('Adicionar código'));
  openLayer(h('div', { class: 'layer' }, h('div', { class: 'sheet' }, h('h2', { text: t('Trapaças') + ' · ' + g.name }),
    h('p', { text: t('Os códigos (Game Genie, Action Replay, GameShark…) ligam e desligam na hora, pelo menu do jogo.') }),
    h('div', { class: 'scroll', style: { overflowY: 'auto', maxHeight: '40vh' } }, box), h('div', null, add))));
}

/* ---------------- Conectar controle (Bluetooth ou Celular) ---------------- */
const CONTROLE_APK_URL = 'https://github.com/ruan2311/onix/releases/download/controle-v1.0.7/onix-controle.apk';

function openConnectPadSheet(onDone) {

/* PC: os jogos vêm de pastas do computador. As pastas ficam guardadas e, a cada abertura, o

  handlers.folders = () => { if (PAGE === 'add') drawFolders(); };

    h('div', { class: 'col' },
      h('h1', { text: t('Adicionar jogos') }),

      h('div', { class: 'sep', text: t('Pastas de jogos') }), folders,

    h('div', { class: 'col' }, h('div', { class: 'xfers', id: 'xfers' }), h('div', { class: 'store', id: 'store' }))));

/* ---------------- Pendrive e HD (TV) ----------------
   Muitas TVs não têm gerenciador de arquivos: o GameHub lista as pastas do pendrive e copia os
   jogos para a TV (UsbDrives). O cartão mostra o pendrive ligado, pede a permissão na primeira vez e
   avisa quando a TV não conseguiu abrir o pendrive (formato que ela não lê, ou HD sem energia). */
let usbInfo = {};
function drawUsb(s) {
  const el = $('#usb');
  if (s) usbInfo = s;
  else if (el) usbInfo = json(call('usbState'), {});
  if (!el) return;
  s = usbInfo;
  const drives = s.drives || [], acts = [];
  const warn = !drives.length && (s.unread > 0 || (s.bad || []).length > 0);
  const lines = drives.map(d => [d.name || t('Pendrive'), d.fs, d.free != null ? t('{n} livres', { n: fmtBytes(d.free) }) : ''].filter(Boolean).join(' · '));
  const msg = drives.length ? lines.join('\n') : warn
    ? t('A TV não conseguiu abrir o pendrive ou HD ligado. Ele precisa estar formatado em FAT32 ou exFAT: o NTFS, que o Windows usa nos HDs, muitas TVs não leem. HD sem energia suficiente também não aparece.')
    : t('Ligue um pendrive, HD externo ou cartão de memória na TV para jogar direto dele, sem ocupar a memória da TV.');
  if (drives.length && !s.permission) acts.push(h('button', { class: 'f btn primary', act: () => call('usbAsk') }, icon('usb'), t('Permitir ler o pendrive')));
  if (drives.length && s.permission) drives.slice(0, 3).forEach(d => acts.push(h('button', { class: 'f btn primary', act: () => usbBrowse(d.path, d.name || t('Pendrive')) },
    icon('folder'), drives.length > 1 ? t('Abrir {n}', { n: d.name || t('Pendrive') }) : t('Abrir o pendrive'))));
  acts.push(h('button', { class: 'f btn', act: usbHelp }, icon('info'), t('O que o pendrive precisa')));
  const had = focused && el.contains(focused);
  el.className = 'usb' + (warn ? ' warn' : '');
  el.replaceChildren(...[h('div', { class: 'top' }, icon('usb'), h('b', { text: t('Pendrive ou HD') })), h('p', { text: msg }),
    drives.length && !s.permission ? h('p', { class: 'sub', text: t('Na primeira vez, o GameHub pede para ler o armazenamento. Ele só lê os jogos: nunca apaga nem muda nada no pendrive.') }) : null,
    h('div', { class: 'acts' }, ...acts)].filter(Boolean));
  if (had) ensureFocus(el.querySelector('.f'));
}
handlers.usb = s => {
  const before = (usbInfo.drives || []).length;
  drawUsb(s);
  const now = (s.drives || []).length;
  if (s.event === 'mounted' && now > before) toast(PAGE === 'add' ? t('Pendrive conectado') : t('Pendrive conectado: abra Adicionar jogos para pôr os jogos dele na biblioteca'));
  else if (s.event === 'removed' && now < before) toast(t('Pendrive desconectado'));
  else if ((s.event === 'unmountable' || s.event === 'attached') && !now && (s.unread > 0 || (s.bad || []).length)) toast(t('A TV não conseguiu abrir o pendrive. Veja em Adicionar jogos o que ele precisa.'));
  else if (s.event === 'permission' && s.permission) toast(t('Pronto: o GameHub já pode ler o pendrive'));
};
handlers.usbMissing = g => ask(t('Ligue o pendrive'), g.drive ? t('{g} está no pendrive {d}. Ligue ele na TV e tente de novo.', { g: g.name, d: g.drive }) : t('{g} está num pendrive. Ligue ele na TV e tente de novo.', { g: g.name }), [[t('Entendi')]]);
handlers.usbAsk = how => {
  if (how === 'screen') toast(t('Ligue o Cobalt GameHub na lista e volte com o botão Voltar'));
  else if (how === 'details' || how === 'none') usbManual(how);
};

function usbManual(how) {
  const sdk = usbInfo.sdk || 0;
  const path = sdk >= 30 ? t('Configurações da TV → Apps → Acesso especial a apps → Acesso a todos os arquivos → Cobalt GameHub, e ligue.')
    : t('Configurações da TV → Apps → Cobalt GameHub → Permissões → Armazenamento, e ligue.');
  openLayer(h('div', { class: 'layer' }, h('div', { class: 'sheet', style: { width: '56rem', maxWidth: '92vw' } },

  if (!hw || !hw.consoles) return [];
  const st = { ok: t('Roda bem'), slow: t('Roda, mas pode ficar lento'), no: t('Abaixo do mínimo') };
  const color = { ok: '#4ade80', slow: '#fbbf24', no: '#ff5a6e' };
  const names = { n64: 'Nintendo 64', ds: 'Nintendo DS', psp: 'PSP', gc: 'GameCube', wii: 'Wii', ps2: 'PlayStation 2' };
  const ram = hw.ramMb ? (hw.ramMb / 1024).toFixed(1).replace('.', ',') + ' GB' : '?';
  return [
    h('div', { class: 'sep', text: t('Este aparelho') }),
    h('div', { class: 'f item' }, icon('info'), h('span', { class: 'grow' }, (hw.model || '') + ' · ' + t('Faixa: {f}', { f: t(hw.tierName) }),
      h('span', { class: 'sub', text: [hw.cpu, t('Memória') + ' ' + ram, hw.is64 ? '64 bits' : '32 bits', 'OpenGL ES ' + hw.gles, hw.gpu].filter(Boolean).join(' · ') }))),
    ...hw.consoles.map(c => h('div', { class: 'f item' }, h('span', { class: 'dot', style: { background: color[c.status] } }),
      h('span', { class: 'grow' }, names[c.id], h('span', { class: 'sub', text: t('Mínimo: {m}', { m: t(MIN_TEXT[c.id]) }) })),
      h('span', { class: 'val', text: st[c.status] }))),
  ];
}

function aboutBody() {
  const up = json(call('update'), {});
  const wrap = h('div');
  const status = { none: t('Em dia'), checking: t('Procurando…'), downloading: t('Baixando…'), installing: t('Instalando…'), error: t('Sem conexão com o GitHub') }[up.state] || '';
  const engine = (m => m ? 'Chrome ' + m[1] : 'desconhecido')(/Chrome\/(\d+)/.exec(navigator.userAgent));
  const list = h('div', { class: 'list' },
    h('div', { class: 'item' }, h('span', { style: { width: '3.4rem' } }, svg(MARK)), h('span', { class: 'grow' }, 'Cobalt GameHub', h('span', { class: 'sub', text: t('Versão {v}', { v: INFO.version || '' }) + (status ? ' · ' + status : '') }))),
    h('div', { class: 'item' }, icon('info'), h('span', { class: 'grow' }, t('Navegador da TV'), h('span', { class: 'sub', text: engine }))),
    up.latest && (up.state === 'available' || up.state === 'ready' || up.state === 'error')
      ? h('button', { class: 'f item', act: () => { call('installUpdate'); toast(t('Baixando…')); } }, icon('load'), h('span', { class: 'grow', text: t('Instalar atualização {v}', { v: up.latest }) }))
      : h('button', { class: 'f item', act: () => { call('checkUpdate'); toast(t('Procurando…')); } }, icon('reset'), h('span', { class: 'grow', text: t('Procurar atualizações') })),
    ...hardwareRows(),
    h('div', { class: 'sep', text: t('Créditos e licenças') }),
    h('p', { class: 'credits', text: t('Emuladores de código aberto do projeto libretro:') }),
    ...[['FCEUmm (NES)', 'fceumm', 'GPL-2.0'], ['Snes9x (SNES)', 'snes9x', 'Snes9x, não comercial'], [CONSOLES.some(c => c.id === 'gbc') ? 'mGBA (GBA e Game Boy Color)' : 'mGBA (GBA)', 'mgba', 'MPL-2.0'], ['Genesis Plus GX (Mega Drive)', 'genesis_plus_gx', 'não comercial'],
      ...(CONSOLES.some(c => c.id === 'ps1') ? [['PCSX ReARMed (PlayStation)', 'pcsx_rearmed', 'GPL-2.0']] : []),
      ...(CONSOLES.some(c => c.id === 'atari') ? [['Stella 2014 (Atari 2600)', 'stella2014', 'GPL-2.0'], ['ProSystem (Atari 7800)', 'prosystem', 'GPL-2.0']] : []),
      ...(CONSOLES.some(c => c.id === 'arcade') ? [['FinalBurn Neo (Fliperama)', 'fbneo', 'FBNeo, não comercial']] : []),
      ...(CONSOLES.some(c => c.ra) ? [['Emuladores de N64, DS, PSP, GameCube, Wii e PS2 (RetroArch)', 'retroarch', 'GPL']] : []),
      ...(!CONSOLES.some(c => c.ra) && CONSOLES.some(c => c.id === 'n64') ? [['ParaLLEl N64 (Nintendo 64)', 'parallel_n64', 'GPL-2.0'], ['melonDS DS (Nintendo DS)', 'melondsds', 'GPL-3.0'], ['PPSSPP (PSP)', 'ppsspp', 'GPL-2.0']] : []),
      ...(!CONSOLES.some(c => c.ra) && CONSOLES.some(c => c.id === 'gc') ? [['Dolphin (GameCube e Wii)', 'dolphin', 'GPL-2.0'], ['PCSX2 (PlayStation 2)', 'pcsx2', 'GPL-3.0']] : [])]
      .map(([name, file, lic]) => h('button', { class: 'f item', act: () => licenseSheet(name, file) }, h('span', { class: 'grow' }, name, h('span', { class: 'sub', text: lic })), h('span', { class: 'val', text: t('Abrir licença') }))),
    h('button', { class: 'f item', act: () => licenseSheet('libretro-database', 'libretro_database') }, h('span', { class: 'grow' }, t('Nomes dos jogos: libretro-database (No-Intro), CC BY-SA 4.0. Capas: libretro-thumbnails.')), h('span', { class: 'val', text: t('Abrir licença') })),
    h('p', { class: 'credits', text: t('O GameHub é gratuito e de código aberto (GPL-3.0). Nunca terá anúncios nem será vendido.') }),
    h('p', { class: 'credits', text: t('Use só jogos que você tem o direito de usar. Nenhum jogo vem com o GameHub.') }));
  wrap.append(h('h2', { text: t('Sobre') }), list);
  return wrap;
}
/* iPhone: os saves ficam no navegador. O backup é um .zip que a pessoa guarda no app Arquivos. */
function backupRows() {
  return h('div', { class: 'list', style: { marginTop: '1rem' } },
    h('div', { class: 'sep', text: t('Backup dos saves') }),
    h('button', { class: 'f item', act: () => call('exportSaves') }, icon('disk'),
      h('span', { class: 'grow' }, t('Exportar saves'), h('span', { class: 'sub', text: t('Saves, estados salvos e configurações, sem os jogos.') }))),
    h('button', { class: 'f item', act: () => call('importSaves') }, icon('load'),
      h('span', { class: 'grow' }, t('Importar saves'), h('span', { class: 'sub', text: t('Traz de volta um backup. Os jogos que faltarem voltam ao adicionar o arquivo deles.') }))));
}
handlers.backup = b => {
  if (b.state === 'working') toast(t('Preparando o backup…'));
  else if (b.state === 'ready') ask(t('Backup pronto'), t('Guarde o arquivo ({s}) no app Arquivos ou no iCloud.', { s: fmtBytes(b.size) }), [[t('Salvar arquivo'), () => call('saveBackup')], [t('Cancelar')]]);
  else if (b.state === 'restored') toast(t('Backup restaurado'));
  else if (b.state === 'badfile') toast(t('Esse arquivo não é um backup do GameHub.'));
  else toast(t('Não deu para fazer o backup.'));
};
handlers.toast = text => toast(t(text));
function licenseSheet(name, file) {
  const pre = h('pre', { style: { whiteSpace: 'pre-wrap', fontSize: '1.05rem', color: 'var(--dim)', lineHeight: 1.45, fontFamily: 'inherit' } }, t('Carregando…'));
  fetch('licenses/' + file + '.txt').then(r => r.text()).then(s => { pre.textContent = s; }).catch(() => { });
  const box = h('div', { class: 'f', style: { overflowY: 'auto', maxHeight: '66vh', borderRadius: '1rem', padding: '1rem' } }, pre);
  box._left = () => { box.scrollTop -= 300; };
  box._right = () => { box.scrollTop += 300; };
  // ▲ ▼ rolam o texto
  const key = e => { if (e.key === 'ArrowDown') { box.scrollTop += 120; e.stopPropagation(); e.preventDefault(); } if (e.key === 'ArrowUp') { box.scrollTop -= 120; e.stopPropagation(); e.preventDefault(); } };
  document.addEventListener('keydown', key, true);
  openLayer(h('div', { class: 'layer' }, h('div', { class: 'sheet', style: { width: '80rem', maxWidth: '80rem' } }, h('h2', { text: name }), box)), { onClose: () => document.removeEventListener('keydown', key, true) });
}

/* ---------------- Eventos ---------------- */
handlers.gamepads = list => {
  INFO.gamepads = list;
  renderChips();
  if (list.length && pendingPlay && layers.length) {
    closeLayer();
    toast(t('Controle conectado') + ': ' + list[list.length - 1].name);
    const p = pendingPlay; pendingPlay = null;
    call('play', p[0].id, p[1]);
  } else if (list.length) toast(t('Controle conectado') + ': ' + list[list.length - 1].name);
  if (PAGE === 'settings' && setSection === 'pads' && !layers.length) show('settings', true);
};
handlers.gamepadClients = r => {
  try {
    const o = typeof r === 'string' ? JSON.parse(r) : r;
    INFO.gamepadClients = o.count;
    renderChips();
    const st = $('#phonePadStatus');
    if (st) {
      st.textContent = o.count > 0 ? (o.count === 1 ? t('🎮 1 celular conectado jogando!') : t('🎮 {n} celulares conectados!', { n: o.count })) : t('Aponte a câmera do celular para o QR code ou digite o link no navegador.');
      st.style.color = o.count > 0 ? '#4ade80' : 'var(--dim)';
    }
  } catch (_) {}
};
handlers.cover = () => {
  loadLibrary();
  if (!layers.length && PAGE !== 'add' && PAGE !== 'settings') show(PAGE, true);
};
/* Atualizar capas: baixa de novo todas, uma por vez; no fim chega o evento "covers". */
let coversBusy = false;
function refreshCovers() {
  const n = call('refreshCovers');
  if (n === -1) toast(t('As capas já estão sendo atualizadas.'));
  else if (n === 0) toast(t('Nenhum jogo'));
  else { toast(t('Atualizando capas…')); coversBusy = true; renderChips(); }
}
handlers.covers = r => {
  coversBusy = false;
  renderChips();
  loadLibrary();
  if (!layers.length && PAGE !== 'add' && PAGE !== 'settings') show(PAGE, true);
  toast(r && r.updated ? t('{n} de {t} capas atualizadas', { n: r.updated, t: r.total }) : t('Nenhuma capa baixada. Confira a internet.'));
};
/* Consoles do RetroArch: o download do emulador na primeira vez, a abertura e os erros. */
handlers.engine = e => {
  const c = consoleOf(e.console);
  if (e.stage === 'motor') toast(t('Preparando o emulador, só na primeira vez… {n}%', { n: e.pct }));
  else if (e.stage === 'core') toast(t('Baixando o emulador de {c}, só na primeira vez… {n}%', { c: t(c.name), n: e.pct }));
  else if (e.stage === 'open') toast(t('Abrindo o jogo. Tab ou Select + Start abre o menu; Esc volta ao GameHub.'));
  else if (e.stage === 'closed' && e.quick) toast(t('O jogo fechou logo ao abrir. O arquivo pode não ser deste console.'));
  else if (e.stage === 'error' && e.msg === 'bios') ask(t('Falta o BIOS do {c}', { c: t(c.name) }),
    t('Para jogar {c}, copie o BIOS do seu próprio console para a pasta que abriu e tente de novo. O GameHub não traz BIOS.', { c: t(c.name) }),
    [[t('Abrir a pasta de novo'), () => call('openBios', c.id)], [t('Fechar')]]);
  else if (e.stage === 'error') toast(t('Não deu para abrir o jogo. Tente de novo.'));
};
handlers.library = () => { loadLibrary(); if (!layers.length) show(PAGE, true); };
handlers.resume = () => { renderChips(); };
handlers.back = () => back();
handlers.open = info => { INFO = Object.assign(INFO, info); if (!String(INFO.open || '').startsWith('resume:')) playBoot(); applyOpen(); };
handlers.update = up => { if (PAGE === 'settings' && setSection === 'about' && !layers.length) show('settings', true); maybeUpdateBanner(up); };

let askedUpdate = '';
function maybeUpdateBanner(up) {
  if (!up || !up.latest) return;
  // Celular: a APK baixa sozinha; quando fica pronta, pergunta uma vez por versão nesta sessão.
  if (INFO.mobile) {
    if (up.state !== 'ready' || askedUpdate === up.latest || INFO.kids) return;
    askedUpdate = up.latest;
    ask(t('Atualização pronta'), t('A versão {v} do GameHub já foi baixada. Instalar agora? Seus jogos continuam.', { v: up.latest }),
      [[t('Instalar'), () => call('installUpdate')], [t('Depois')]]);
    return;
  }
  if (up.state !== 'available' || INFO.fromOnix && INFO.onix) return;
  toast(t('Nova versão do GameHub: {v}', { v: up.latest }));
}

onBack = () => {
  if (PAGE !== 'home') { show('home'); return; }
  call('exit');
};

function applyOpen() {
  LANG = INFO.lang === 'es' ? 'es' : 'pt';
  setMobile(INFO.mobile);
  document.documentElement.classList.toggle('pc', !!INFO.pc);
  applyUiPrefs();
  document.documentElement.lang = LANG === 'es' ? 'es' : 'pt-BR';
  loadLibrary();
  renderChips();
  const o = INFO.open || 'home';
  if (o.startsWith('console:')) show(o);
  else if (o.startsWith('game:')) { show('home'); const g = LIB.find(x => x.id === o.slice(5)); if (g) openGame(g); }
  else show('home');
}

/* ---------------- Início ---------------- */
INFO = json(call('init'), { profile: 'default', lang: 'pt', gamepads: [], gamepadUrl: '', gamepadClients: 0 });
limitConsoles(INFO.consoles);
// Na TV e no celular os consoles 3D rodam no motor do próprio GameHub, não no RetroArch.
if (!INFO.pc) for (const c of CONSOLES) delete c.ra;
/* PC: mais filtros e ajustes de imagem (feitos na placa de vídeo), tela cheia, e som e animações
   sem o "Igual ao Onix" (não há Onix no PC). */
if (INFO.pc || INFO.web) {
  SETS.filter.choices.splice(4, 0, ['crtcurve', 'CRT curvado'], ['scanlines', 'Linhas de varredura']);
  Object.assign(SETS, {
    brightness: { label: 'Brilho', choices: [70, 80, 90, 100, 110, 120, 130, 140].map(v => [v, v + '%']) },
    saturation: { label: 'Cores (saturação)', choices: [0, 50, 75, 100, 115, 130, 150].map(v => [v, v === 0 ? 'Preto e branco' : v + '%']) },
    scanStrength: { label: 'Força das linhas (CRT)', choices: [10, 20, 30, 40, 50, 60, 70, 80].map(v => [v, v + '%']) },
    curvature: { label: 'Curvatura da tela (CRT curvado)', choices: [[0, 'Reta'], [1, 'Leve'], [2, 'Média'], [3, 'Forte'], [4, 'Bem forte']] },
    vignette: { label: 'Bordas escurecidas', sub: 'Escurece de leve os cantos da imagem, como numa TV de tubo.', bool: true },
    frameBlend: { label: 'Mistura de quadros', sub: 'Junta cada quadro com o anterior: some a piscada de sombras e transparências (bom no Game Boy Advance).', bool: true },
    backdrop: { label: 'Fundo ao redor do jogo', choices: [['ambient', 'Ambiente (a imagem do jogo, borrada)'], ['glass', 'Vidro do GameHub'], ['black', 'Preto']] },
    fullscreen: { label: 'Tela cheia', sub: 'Também com F11 ou Alt + Enter.', bool: true },
    gameFullscreen: { label: 'Tela cheia ao jogar', sub: 'A janela ocupa a tela toda enquanto o jogo está aberto e volta ao normal quando você sai dele.', bool: true },
  });
  GROUPS.image = ['filter', 'scale', 'aspect', 'brightness', 'saturation', 'scanStrength', 'curvature', 'vignette', 'frameBlend', 'backdrop', 'fullscreen', 'gameFullscreen', 'showFps'];
  for (const k of ['sounds', 'motion']) { SETS[k].choices = [['on', 'Ligado'], ['off', 'Desligado']]; delete SETS[k].onix; }
  SETS.motion.sub = 'Transições e efeitos do foco.';
  SETS.latency.sub = 'Menos atraso pode estalar em computadores mais lentos.';
  if (INFO.web) GROUPS.image = GROUPS.image.filter(k => k !== 'fullscreen' && k !== 'gameFullscreen');
}
brand($('#brand'));
// A marca da abertura: o controle com o anel e cada letra num <i> (sobem uma a uma).
$('#bootBrand').replaceChildren(h('span', { class: 'mk' }, svg(MARK), h('i', { class: 'ring' })),
  h('span', null, h('b', null, ...Array.from('COBALT GAMEHUB', (ch, i) => h('i', { style: '--i:' + i }, ch === ' ' ? '\u00a0' : ch))),
    h('small', { text: 'By Ruan' }), h('i', { class: 'bar' })));
// Abertura: toca ao abrir e de novo quando o Onix chama o GameHub que já estava aberto.
function playBoot() {
  if (location.hash) {
    const old = $('#boot');
    if (old) old.remove();
    document.documentElement.classList.remove('booting');
    return;
  }
  const old = $('#boot');
  const n = old.cloneNode(true);
  n.classList.remove('go');
  old.replaceWith(n);
  const root = document.documentElement;
  root.classList.add('booting');
  let started = false;
  const go = () => {
    if (started) return;
    started = true;
    n.classList.add('go');
    // As animações do hub começam junto com o fim da abertura (1,9 s depois do "go").
    setTimeout(() => {
      root.classList.remove('booting');
      try { if (n && n.parentNode) n.remove(); } catch (_) {}
    }, 2400);
  };
  requestAnimationFrame(() => requestAnimationFrame(go));
  setTimeout(go, 700);   // sem quadros (página escondida): nunca deixa a tela presa no preto
}
playBoot();
tick(); setInterval(tick, 15000);
applyOpen();
if (!Hub) {   // aberto num navegador comum (pré-visualização): dados de exemplo
  LIB = [];
  show('home');
  if (location.hash === '#connect-pad') openConnectPadSheet();
  else if (location.hash === '#phone-pad') openPhonePadTutorialSheet();
}
</script>
</body>
</html>
