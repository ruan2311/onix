<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0722">
<title>Onix GameHub</title>
<style>
:root{--ink:#f1edff;--dim:#a99fd0;--mute:#7a70a6;--pink:#ff3d9a;--cyan:#3de1ff;--grad:linear-gradient(90deg,var(--pink),var(--cyan));--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(130% 80% at 10% 0%,#1b0f3d,#0d0722 50%,#07040f);color:var(--ink);
  font-family:system-ui,-apple-system,Roboto,sans-serif;padding:22px 16px 40px;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand b{font-size:15px;letter-spacing:.3em;font-weight:500;color:var(--ink)}
.brand small{font-size:11px;color:var(--dim);letter-spacing:.06em;margin-left:4px}
h1{font-size:24px;font-weight:800;line-height:1.2}
p{color:var(--dim);font-size:15px;line-height:1.5}
.pick{display:flex;align-items:center;justify-content:center;gap:10px;height:58px;border-radius:999px;background:var(--grad);color:#14082c;font-weight:700;font-size:17px;border:0;width:100%}
input[type=file]{display:none}
#codeBox{display:flex;flex-direction:column;gap:10px}
#codeBox[hidden],.pick[hidden],#store[hidden]{display:none}
.coderow{display:flex;gap:10px}
#code{flex:1;min-width:0;height:54px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:inherit;
  font:inherit;font-size:26px;letter-spacing:.3em;text-align:center}
#codeGo{height:54px;padding:0 22px;border-radius:999px;border:0;background:var(--grad);color:#14082c;font:inherit;font-weight:700;font-size:16px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.list{display:flex;flex-direction:column;gap:10px}
.x{display:flex;flex-direction:column;gap:8px}
.x .top{display:flex;gap:10px;align-items:center;font-size:15px}
.x .top b{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x .ok{color:#7ef0b0}.x .err{color:#ff8aa5}.x .wait{color:var(--mute)}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.bar span{display:block;height:100%;background:var(--grad);width:0}
.small{font-size:13px;color:var(--mute);line-height:1.5}
.bad{color:#ffd27a}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><svg width="40" height="40" viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 14.5h16a9.5 9.5 0 0 1 9.2 7.1l2.3 8.9a5 5 0 0 1-8.9 4.2L31 30H17l-3.6 4.7a5 5 0 0 1-8.9-4.2l2.3-8.9A9.5 9.5 0 0 1 16 14.5z"/><path d="M15 19.5v6M12 22.5h6"/><circle cx="32.5" cy="20.6" r="1.25" fill="#fff" stroke="none"/><circle cx="35.9" cy="24" r="1.25" fill="#fff" stroke="none"/></svg><span><b>ONIX GAMEHUB</b> <small>By Ruan</small></span></div>
  <h1 id="title"></h1>
  <p id="lead"></p>
  <form class="card" id="codeBox" hidden><label for="code" id="codeLabel"></label>
    <div class="coderow"><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"><button id="codeGo"></button></div>
    <span class="bad" id="codeErr"></span></form>
  <label class="pick" for="files" id="pickLabel"></label>
  <input type="file" id="files" multiple accept=".nes,.unf,.unif,.fds,.sfc,.smc,.swc,.fig,.gba,.md,.gen,.smd,.bin,.zip">
  <div class="list" id="list"></div>
  <div class="card small" id="store"></div>
  <p class="small" id="formats"></p>
  <p class="small" id="legal"></p>
</div>
<script>
'use strict';
const ES = /^es\b/i.test(navigator.language || '');
const T = ES ? {
  title: 'Manda juegos a la TV', lead: 'Elige uno o varios archivos. Llegan directo a GameHub en la TV.',
  pick: 'Elegir archivos', formats: 'Formatos: .nes, .sfc, .smc, .gba, .md, .gen, .bin y .zip (NES, Super Nintendo, Game Boy Advance y Mega Drive).',
  legal: 'Usa solo juegos que tengas derecho a usar. Ningún juego viene con GameHub.',
  wait: 'En la fila', send: 'Enviando', done: 'Listo en la TV', dup: 'Ya estaba en la biblioteca', fail: 'No se pudo enviar',
  key: 'Este enlace ya no vale. En la TV, abre Agregar juegos de nuevo y lee el código QR nuevo.',
  code: 'Escribe el código de 6 números que aparece en la TV, en Agregar juegos.', go: 'Entrar', wrong: 'Código incorrecto. Revísalo en la TV.',
  store: 'Libre para juegos en la TV: {a}', net: 'Se perdió la conexión con la TV. ¿El celular sigue en el mismo Wi-Fi?',
} : {
  title: 'Mande jogos para a TV', lead: 'Escolha um ou vários arquivos. Eles vão direto para o GameHub na TV.',
  pick: 'Escolher arquivos', formats: 'Formatos: .nes, .sfc, .smc, .gba, .md, .gen, .bin e .zip (NES, Super Nintendo, Game Boy Advance e Mega Drive).',
  legal: 'Use só jogos que você tem o direito de usar. Nenhum jogo vem com o GameHub.',
  wait: 'Na fila', send: 'Enviando', done: 'Pronto na TV', dup: 'Já estava na biblioteca', fail: 'Não deu para enviar',
  key: 'Este link não vale mais. Na TV, abra Adicionar jogos de novo e leia o QR code novo.',
  code: 'Digite o código de 6 números que aparece na TV, em Adicionar jogos.', go: 'Entrar', wrong: 'Código errado. Confira na TV.',
  store: 'Livre para jogos na TV: {a}', net: 'A conexão com a TV caiu. O celular continua no mesmo Wi-Fi?',
};
// Mensagens que vêm da TV (em português) e a tradução para o espanhol.
const ERR_ES = {
  'Esse tipo de arquivo não é de NES, SNES, GBA ou Mega Drive.': 'Ese tipo de archivo no es de NES, SNES, GBA o Mega Drive.',
  'O .zip não tem nenhum jogo de NES, SNES, GBA ou Mega Drive.': 'El .zip no tiene ningún juego de NES, SNES, GBA o Mega Drive.',
  'O arquivo não parece um jogo desse console.': 'El archivo no parece un juego de esa consola.',
  'Sem espaço seguro na TV para esse jogo.': 'No hay espacio seguro en la TV para ese juego.',
  'Não deu para guardar o jogo na TV.': 'No se pudo guardar el juego en la TV.',
  'Não deu para ler esse arquivo.': 'No se pudo leer ese archivo.',
  'Arquivo grande demais.': 'Archivo demasiado grande.', 'Arquivo sem nome.': 'Archivo sin nombre.',
};
const err = m => ES && ERR_ES[m] ? ERR_ES[m] : m;
const $ = s => document.querySelector(s);
let KEY = (location.hash.match(/k=([0-9a-f]{32})/) || [])[1] || '';
$('#title').textContent = T.title; $('#lead').textContent = T.lead; $('#pickLabel').textContent = T.pick;
$('#formats').textContent = T.formats; $('#legal').textContent = T.legal;
if (ES) document.documentElement.lang = 'es';

// Sem a chave do QR (digitou só o endereço): pede o código da TV e troca pela chave.
$('#codeLabel').textContent = T.code; $('#codeGo').textContent = T.go;
function askCode() {
  $('#codeBox').hidden = false; $('#pickLabel').hidden = true; $('#store').hidden = true;
  $('#code').focus();
}
$('#codeBox').addEventListener('submit', e => {
  e.preventDefault();
  const c = $('#code').value.replace(/\D/g, '');
  if (c.length !== 6) { $('#codeErr').textContent = T.wrong; return; }
  fetch('/api/info', { headers: { 'X-Key': c } }).then(r => {
    if (r.status === 403) throw new Error('key');
    return r.json();
  }).then(s => {
    if (!/^[0-9a-f]{32}$/.test(s.k || '')) throw new Error('key');
    KEY = s.k; history.replaceState(null, '', '#k=' + KEY);
    $('#codeBox').hidden = true; $('#pickLabel').hidden = false; $('#store').hidden = false;
    info();
  }).catch(e => { $('#codeErr').textContent = e.message === 'key' ? T.wrong : T.net; $('#code').select(); });
});

function fmt(b) { return b >= 1e9 ? (b / 1073741824).toFixed(1).replace('.', ',') + ' GB' : Math.round(b / 1048576) + ' MB'; }
function info() {
  fetch('/api/info', { headers: { 'X-Key': KEY } }).then(r => {
    if (r.status === 403) throw new Error('key');
    return r.json();
  }).then(s => { $('#store').textContent = T.store.replace('{a}', fmt(s.available || 0)); })
    .catch(e => { $('#store').innerHTML = ''; $('#store').append(Object.assign(document.createElement('span'), { className: 'bad', textContent: e.message === 'key' ? T.key : T.net })); });
}
if (KEY) info(); else askCode();

const queue = [];
let busy = false;
$('#files').addEventListener('change', e => {
  for (const f of e.target.files) queue.push(row(f));
  e.target.value = '';
  next();
});
function row(f) {
  const el = document.createElement('div');
  el.className = 'card x';
  el.innerHTML = '<div class="top"><b></b><span class="wait"></span></div><div class="bar"><span></span></div>';
  el.querySelector('b').textContent = f.name;
  el.querySelector('.top span').textContent = T.wait;
  $('#list').prepend(el);
  return { f, el };
}
function next() {
  if (busy || !queue.length) return;
  busy = true;
  const { f, el } = queue.shift();
  const st = el.querySelector('.top span'), bar = el.querySelector('.bar span');
  st.className = 'wait'; st.textContent = T.send;
  const x = new XMLHttpRequest();
  x.open('PUT', '/api/upload?name=' + encodeURIComponent(f.name));
  x.setRequestHeader('X-Key', KEY);
  x.upload.onprogress = e => { if (e.lengthComputable) { bar.style.width = Math.round(e.loaded / e.total * 100) + '%'; st.textContent = T.send + ' ' + Math.round(e.loaded / e.total * 100) + '%'; } };
  x.onload = () => {
    let r = {};
    try { r = JSON.parse(x.responseText); } catch (_) { }
    if (x.status === 403) { st.className = 'err'; st.textContent = T.key; }
    else if (r.ok) { st.className = 'ok'; st.textContent = r.dup ? T.dup : T.done; el.querySelector('b').textContent = r.name || f.name; bar.style.width = '100%'; }
    else { st.className = 'err'; st.textContent = err(r.error) || T.fail; }
    el.querySelector('.bar').style.display = r.ok ? 'none' : '';
    busy = false; info(); next();
  };
  x.onerror = () => { st.className = 'err'; st.textContent = T.net; busy = false; next(); };
  x.send(f);
}
</script>
</body>
</html>
