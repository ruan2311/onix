<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu do jogo</title>
<link rel="stylesheet" href="common.css">
<style>
html,body{background:transparent}
.shade{position:fixed;inset:0;background:linear-gradient(90deg,rgba(4,2,10,.94) 0,rgba(4,2,10,.82) 40rem,rgba(4,2,10,.35) 100%)}
.panel{position:fixed;left:0;top:0;bottom:0;width:42rem;padding:3.2rem 3rem;display:flex;flex-direction:column;gap:1.4rem}
.head{display:flex;align-items:center;gap:1rem}
.head svg{width:3.2rem;height:3.2rem;flex:none}
.head .t{min-width:0}
.head .t b{display:block;font-size:1.65rem;font-weight:800;line-height:1.15;max-height:3.9rem;overflow:hidden}
.head .t small{font-size:1.05rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.msg{padding:1.2rem 1.4rem;border-radius:1rem;background:rgba(255,210,122,.1);border:1px solid rgba(255,210,122,.3)}
.msg b{display:block;font-size:1.35rem;color:#ffd27a}
.msg span{font-size:1.15rem;color:var(--dim)}
.scroll{flex:1;overflow-y:auto}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.slot{border-radius:1rem;overflow:hidden;background:var(--glass);border:1px solid var(--line);display:flex;flex-direction:column}
.slot .pic{aspect-ratio:4/3;background:#000;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:1.1rem}
.slot .pic img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.slot .lb{padding:.7rem 1rem;font-size:1.1rem;display:flex;justify-content:space-between;gap:.5rem}
.slot .lb small{color:var(--mute)}
.hint{font-size:1.05rem;color:var(--mute);line-height:1.5}
.hide{display:none}
/* Celular: o menu ocupa a tela (em pé) ou a metade esquerda (deitado). */
html.mobile .shade{background:rgba(4,2,10,.9)}
html.mobile .panel{width:min(100%, 30rem);padding:1.2rem 1rem;gap:1rem}
html.mobile .head svg{width:2.2rem;height:2.2rem}
html.mobile .head .t b{font-size:1.15rem;max-height:2.8rem}
html.mobile .head .t small{font-size:.72rem}
html.mobile .msg b{font-size:1.05rem}
html.mobile .msg span,html.mobile .hint{font-size:.85rem}
html.mobile .slot .lb{font-size:.85rem}
</style>
</head>
<body>
<div class="shade"></div>
<div class="panel" id="panel"></div>
<script src="common.js"></script>
<script>
'use strict';
const M = window.Menu || (window.parent !== window && window.parent.OnixMenu) || null;   // TV: ponte Java; PC: o game.js
let INFO = {}, view = 'main', reason = '';
function call(name, ...args) { try { return M ? M[name](...args) : null; } catch (e) { return null; } }
function json(s, def) { try { return s ? JSON.parse(s) : def; } catch (_) { return def; } }

function refreshInfo() {
  INFO = json(call('info'), INFO);
  LANG = INFO.lang === 'es' ? 'es' : 'pt';
  applyUi(INFO.sounds !== false, INFO.motion !== false);
  setMobile(INFO.mobile);
  document.documentElement.classList.toggle('pc', !!INFO.pc);
}

function header() {
  const c = consoleOf(INFO.console);
  return h('div', { class: 'head' }, svg(MARK), h('div', { class: 't' },
    h('small', { style: { color: c.color }, text: t(c.name) }), h('b', { text: INFO.name || '' })));
}

function message() {
  if (reason === 'disconnected') return h('div', { class: 'msg' }, h('b', { text: t('O controle desconectou') }), h('span', { text: t('Reconecte o controle ou continue com outro.') }));
  if (reason === 'error' || INFO.failed) return h('div', { class: 'msg' }, h('b', { text: t('Não deu para abrir este jogo') }), h('span', { text: t('O arquivo pode estar corrompido ou ser de outra versão do console.') }));
  return null;
}

function item(ic, label, act, val, extra) {
  const b = h('button', { class: 'f item' + (extra && extra.on ? ' on' : '') }, ic ? icon(ic) : null, h('span', { class: 'grow' }, label, extra && extra.sub ? h('span', { class: 'sub', text: extra.sub }) : null), val != null ? h('span', { class: 'val', text: val }) : null);
  b._act = act;
  return b;
}

function draw(focusIndex) {
  const p = $('#panel');
  const body = h('div', { class: 'scroll' });
  p.replaceChildren(...[header(), message(), body].filter(Boolean));
  if (view === 'main') body.append(mainList());
  else if (view === 'save' || view === 'load') body.append(slotsView(view));
  else if (view === 'image') body.append(imageList());
  else if (view === 'core') body.append(h('p', { class: 'hint', text: t('Carregando…') }));
  else if (view === 'cheats') body.append(cheatsList());
  else if (view === 'pads') body.append(padsList());
  else if (view === 'phonePad') body.append(phonePadView());
  else if (view === 'buttons') body.append(buttonsList());
  const list = $$('.f', p);
  focus(list[Math.min(list.length - 1, Math.max(0, focusIndex || 0))] || list[0]);
}

function mainList() {
  const list = h('div', { class: 'list' });
  if (INFO.failed) {
    list.append(item('exit', t('Sair do jogo'), () => call('quit')));
    return list;
  }
  list.append(item('play', t('Continuar'), () => call('resume')));
  list.append(item('save', t('Salvar estado'), () => go('save')));
  list.append(item('load', t('Carregar estado'), () => go('load')));
  const ff = item('ff', t('Avançar rápido'), null, INFO.ff ? t('Ligado') : t('Desligado'), { on: INFO.ff });
  ff._act = () => { INFO.ff = !INFO.ff; call('setFastForward', INFO.ff); call('resume'); };
  list.append(ff);
  if (INFO.pc) {
    const on = !!(INFO.settings || {}).gameFullscreen;
    const full = item('full', t('Tela cheia ao jogar'), null, on ? t('Ligado') : t('Desligado'), { on });
    full._act = () => { call('setGameFullscreen', !on); refreshInfo(); draw(focusedIndex()); };
    list.append(full);
  }
  if (!INFO.kids) {
    list.append(item('img', t('Imagem'), () => go('image'), null, { sub: t('Vale só para este jogo.') }));
    list.append(item('sliders', t('Opções do emulador'), () => { go('core'); call('coreOptions'); }));
    list.append(item('code', t('Trapaças'), () => go('cheats')));
    list.append(item('pad', t('Atribuir botões'), () => go('buttons'), null, { sub: t('Vale só para este jogo.') }));
    if (INFO.mobile) list.append(item('sliders', t('Controles na tela'), () => call('editTouch'), null, { sub: t('Arraste os botões e mude o tamanho.') }));
  }
  list.append(item('pad', t('Controles'), () => go('pads'), String((INFO.gamepads || []).length || t('Sem controle'))));
  list.append(item('reset', t('Reiniciar o jogo'), () => ask(t('Reiniciar o jogo') + '?', t('O que não foi salvo no jogo desde o último save se perde.'),
    [[t('Reiniciar'), () => call('reset'), 'danger'], [t('Cancelar')]])));
  list.append(item('exit', t('Sair do jogo'), () => call('quit')));
  list.append(h('p', { class: 'hint', style: { marginTop: '1rem' }, text: t('Segure R2: acelera · Segure L2: rebobina · Select + Start: este menu') }));
  return list;
}

let stack = [];
function go(v) { stack.push([view, focusedIndex()]); view = v; draw(0); }
function focusedIndex() { return Math.max(0, $$('.f', $('#panel')).indexOf(focused)); }
onBack = () => {
  if (stack.length) { const [v, i] = stack.pop(); view = v; draw(i); return; }
  if (INFO.failed) { call('quit'); return; }
  call('resume');
};

function slotsView(kind) {
  const grid = h('div', { class: 'slots' });
  const states = INFO.states || [];
  const slots = kind === 'save' ? ['1', '2', '3', '4'] : ['auto', '1', '2', '3', '4'];
  for (const s of slots) {
    const st = states.find(x => x.slot === s) || { slot: s };
    if (kind === 'load' && !st.time) continue;
    const pic = h('div', { class: 'pic' });
    if (st.shot) pic.append(h('img', { src: 'shot/' + INFO.profile + '/' + INFO.id + '/' + s + '.jpg?t=' + st.time, alt: '' }));
    else pic.textContent = st.time ? '' : t('Vazio');
    const label = s === 'auto' ? t('Onde parou') : t('Espaço {n}', { n: s });
    const b = h('button', { class: 'f slot' }, pic, h('div', { class: 'lb' }, h('span', { text: label }), h('small', { text: st.time ? ago(st.time) : '' })));
    b._act = () => {
      if (kind === 'save') call('saveState', s);
      else call('loadState', s);
    };
    grid.append(b);
  }
  if (!grid.children.length) return h('p', { class: 'hint', text: t('Vazio') });
  return h('div', null, h('h2', { style: { fontSize: '1.6rem', margin: '0 0 1rem' }, text: kind === 'save' ? t('Salvar estado') : t('Carregar estado') }), grid);
}

/* Imagem deste jogo: filtro, tamanho e proporção (ficam guardados só para ele). */
const IMG = {
  filter: [t('Filtro'), [['sharp', 'Nítido'], ['pixel', 'Pixel puro'], ['smooth', 'Suave'], ['crt', 'CRT (TV antiga)'], ['lcd', 'LCD (portátil)']]],
  scale: [t('Tamanho'), [['fit', 'Ajustar à tela'], ['integer', 'Pixel perfeito'], ['stretch', 'Esticar']]],
  aspect: [t('Proporção'), [['core', 'Original'], ['4:3', '4:3'], ['pixel', 'Pixel quadrado'], ['16:9', '16:9']]],
};
function imageList() {
  const list = h('div', { class: 'list' });
  const eff = INFO.settings || {};
  for (const key of Object.keys(IMG)) {
    const [label, choices] = IMG[key];
    const cur = eff[key];
    const c = choices.find(x => x[0] === cur);
    const row = item(null, t(label), null, null);
    row.append(h('span', { class: 'val' }, h('span', { text: c ? t(c[1]) : cur }), h('span', { class: 'arrows' }, icon('lr'))));
    const set = v => { call('setConfig', 'game:' + INFO.id, key, JSON.stringify(v)); refreshInfo(); draw(focusedIndex()); };
    const i = () => Math.max(0, choices.findIndex(x => x[0] === (INFO.settings || {})[key]));
    row._left = () => set(choices[(i() + choices.length - 1) % choices.length][0]);
    row._right = () => set(choices[(i() + 1) % choices.length][0]);
    row._act = () => picker(t(label), choices.map(x => ({ value: x[0], label: t(x[1]) })), cur, set);
    list.append(row);
  }
  list.append(h('p', { class: 'hint', text: t('Vale só para este jogo.') }));
  return list;
}

/* Atribuir botões: escolhe o botão do console e aperta, no controle, o botão que vai fazer aquilo.
   Fica guardado só para este jogo (por cima do que estiver em Configurações → Controles). */
let KEYNAMES = {};
try { KEYNAMES = JSON.parse(localStorage.getItem('keynames') || '{}'); } catch (_) { }
function buttonsList() {
  const list = h('div', { class: 'list' });
  const remap = (INFO.settings || {}).remap || {};
  for (const [rid, name] of BUTTONS[INFO.console] || []) {
    const keys = Object.keys(remap).filter(k => remap[k] === rid);
    const row = item(null, name, () => captureButton(rid, name), keys.length ? keys.map(k => KEYNAMES[k] || ('#' + k)).join(', ') : t('Padrão'), { on: keys.length > 0 });
    list.append(row);
  }
  list.append(item('reset', t('Restaurar padrão'), () => { call('setConfig', 'game:' + INFO.id, 'remap', null); refreshInfo(); draw(focusedIndex()); }));
  list.append(h('p', { class: 'hint', text: t('OK num botão do console e aperte, no controle, o botão que vai fazer aquilo. Vale só para este jogo.') }));
  return list;
}
function captureButton(rid, name) {
  const back = focusedIndex();
  openLayer(h('div', { class: 'layer' }, h('div', { class: 'sheet' }, h('h2', { text: name }), h('p', { text: t('Aperte o botão no controle…') }),
    h('button', { class: 'f btn', text: t('Cancelar'), act: closeLayer }))), { onClose: () => { handlers.key = null; call('captureKey', false); } });
  handlers.key = k => {
    handlers.key = null;
    KEYNAMES[k.code] = k.name;
    try { localStorage.setItem('keynames', JSON.stringify(KEYNAMES)); } catch (_) { }
    call('setConfig', 'game:' + INFO.id, 'remap.' + k.code, String(rid));
    closeLayer(); refreshInfo(); draw(back);
  };
  call('captureKey', true);
}

/* Opções do emulador (do próprio núcleo), guardadas para este jogo. */
let CORE = null;
handlers.options = o => { CORE = o; if (view === 'core') { const p = $('.scroll'); if (p) { p.replaceChildren(coreList()); ensureFocus(); } } };
function coreList() {
  const list = h('div', { class: 'list' });
  const opts = ((CORE || {}).options || []).filter(o => o.visible !== false && o.values && o.values.length > 1);
  if (!opts.length) { list.append(h('p', { class: 'hint', text: t('Este emulador não tem opções extras.') })); return list; }
  const cats = {};
  for (const [k, d] of (CORE.categories || [])) cats[k] = d;
  let last = null;
  for (const o of opts) {
    if (o.category && o.category !== last && cats[o.category]) { list.append(h('div', { class: 'sep', text: cats[o.category] })); last = o.category; }
    const label = v => { const x = o.values.find(p => p[0] === v); return optLabel(v, x ? x[1] : v); };
    const row = h('button', { class: 'f item' }, h('span', { class: 'grow' }, o.desc), h('span', { class: 'val' }, h('span', { text: label(o.value) }), h('span', { class: 'arrows' }, icon('lr'))));
    const set = v => {
      call('setConfig', 'game:' + INFO.id, 'core.' + o.key, JSON.stringify(v));
      o.value = v;
      row.querySelector('.val span').textContent = label(v);
    };
    const i = () => Math.max(0, o.values.findIndex(p => p[0] === o.value));
    row._left = () => set(o.values[(i() + o.values.length - 1) % o.values.length][0]);
    row._right = () => set(o.values[(i() + 1) % o.values.length][0]);
    row._act = () => picker(o.desc, o.values.map(p => ({ value: p[0], label: optLabel(p[0], p[1]) })), o.value, set);
    list.append(row);
  }
  list.append(h('p', { class: 'hint', text: t('Vale só para este jogo.') }));
  return list;
}

function cheatsList() {
  const list = h('div', { class: 'list' });
  const cheats = json(call('cheats'), []);
  if (!cheats.length) list.append(h('p', { class: 'hint', text: t('Nenhum código ainda.') }), h('p', { class: 'hint', text: t('Os códigos (Game Genie, Action Replay, GameShark…) ligam e desligam na hora, pelo menu do jogo.') }));
  cheats.forEach((c, i) => {
    const row = item('code', c.desc || c.code, null, c.on ? t('Ligado') : t('Desligado'), { on: c.on, sub: c.desc ? c.code : null });
    row._act = () => { c.on = !c.on; call('setCheats', JSON.stringify(cheats)); draw(i); };
    list.append(row);
  });
  const add = item('plus', t('Adicionar código'), () => {
    const code = h('input', { placeholder: t('Código'), maxlength: 200 });
    const desc = h('input', { placeholder: t('Descrição (opcional)'), maxlength: 80 });
    for (const x of [code, desc]) Object.assign(x.style, { fontSize: '1.4rem', padding: '.9rem 1.2rem', borderRadius: '1rem', border: '1px solid var(--line)', background: 'rgba(255,255,255,.06)', width: '100%' });
    openLayer(h('div', { class: 'layer' }, h('div', { class: 'sheet' }, h('h2', { text: t('Novo código') }),
      h('button', { class: 'f item', act: () => code.focus() }, code), h('button', { class: 'f item', act: () => desc.focus() }, desc),
      h('div', { style: { display: 'flex', gap: '1rem' } },
        h('button', { class: 'f btn primary', text: t('Salvar'), act: () => {
          if (!code.value.trim()) return;
          cheats.push({ code: code.value.trim(), desc: desc.value.trim(), on: true });
          call('setCheats', JSON.stringify(cheats)); closeLayer(); draw(cheats.length - 1);
        } }), h('button', { class: 'f btn', text: t('Cancelar'), act: closeLayer })))));
  });
  list.append(add);
  return list;
}

function padsList() {
  const list = h('div', { class: 'list' });
  const pads = INFO.gamepads || [];
  if (!pads.length) list.append(h('div', { class: 'item' }, icon('pad'), h('span', { class: 'grow', text: t('Nenhum controle conectado') })));
  pads.forEach((p, i) => list.append(h('div', { class: 'item' }, icon('pad'), h('span', { class: 'grow', text: p.name }), h('span', { class: 'val', text: p.player ? t('Controle {n}', { n: p.player }) : t('Automático') }))));
  if (INFO.gamepadUrl) {
    const clients = INFO.gamepadClients || 0;
    const sub = clients > 0 ? (clients === 1 ? t('1 celular conectado') : t('{n} celulares conectados', { n: clients })) : t('Jogue pelo navegador do celular sem instalar nada');
    list.append(item('phone', t('Usar celular como controle'), () => go('phonePad'), clients > 0 ? 'P' + clients : t('Abrir QR'), { sub }));
  }
  list.append(item('bt', t('Conectar controle Bluetooth'), () => call('openBluetooth')));
  return list;
}

function phonePadView() {
  const box = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '1.2rem', alignItems: 'center', textAlign: 'center', padding: '1rem 0' } });
  const url = INFO.gamepadUrl || '';
  if (url) {
    const qrWrapper = h('div', { style: { background: '#fff', padding: '1.2rem', borderRadius: '1.2rem', display: 'inline-block', boxShadow: '0 8px 24px rgba(0,0,0,.4)' } });
    const qr = qrSvg(url);
    if (qr) {
      qr.setAttribute('width', '180');
      qr.setAttribute('height', '180');
      qrWrapper.append(qr);
    }
    box.append(qrWrapper);
    box.append(h('div', { style: { fontSize: '1.5rem', fontWeight: '800', color: '#3de1ff', letterSpacing: '.04em' }, text: url }));
    const clients = INFO.gamepadClients || 0;
    const statusText = clients > 0
      ? (clients === 1 ? '🎮 1 celular conectado jogando!' : `🎮 ${clients} celulares conectados!`)
      : t('Aponte a câmera do celular para o QR code ou digite o link no navegador.');
    box.append(h('p', { class: 'hint', style: { maxWidth: '34rem', fontSize: '1.2rem', color: clients > 0 ? '#4ade80' : 'var(--dim)' }, text: statusText }));
  } else {
    box.append(h('p', { class: 'hint', text: t('Não foi possível iniciar o controle web.') }));
  }
  const backBtn = h('button', { class: 'f btn primary', style: { minWidth: '16rem', marginTop: '.8rem' }, text: t('Voltar aos controles') });
  backBtn._act = () => onBack();
  box.append(backBtn);
  return box;
}

/* ---------------- Eventos ---------------- */
handlers.open = r => {
  reason = r || '';
  refreshInfo();
  stack = []; view = 'main';
  closeAllLayers();
  draw(0);
};
handlers.saved = r => {
  INFO.states = r.states || INFO.states;
  toast(r.ok ? t('Estado salvo no espaço {n}', { n: r.slot }) : t('Não deu para salvar o estado.'));
  if (r.ok) { stack = []; view = 'main'; call('resume'); }
  else draw(focusedIndex());
};
handlers.loaded = r => { if (!r.ok) toast(t('Não deu para carregar o estado.')); };
handlers.gamepads = list => {
  INFO.gamepads = list;
  if (reason === 'disconnected' && list.length) reason = '';
  if (!layers.length) draw(focusedIndex());
};
handlers.gamepadClients = r => {
  try {
    const o = typeof r === 'string' ? JSON.parse(r) : r;
    INFO.gamepadClients = o.count;
    if (view === 'pads' || view === 'phonePad') draw(focusedIndex());
  } catch (_) {}
};
handlers.back = () => back();
// Mouse: clicar fora do painel (em cima do jogo) volta, como Voltar.
$('.shade').addEventListener('click', () => { if (!layers.length) back(); });
refreshInfo();
</script>
</body>
</html>
