<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cobalt GameHub</title>
<meta name="description" content="Cobalt GameHub no iPhone: NES, Super Nintendo, Game Boy Advance e Mega Drive. Grátis e sem anúncios.">
<meta name="theme-color" content="#07040f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GameHub">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="stylesheet" href="ios.css">
</head>
<body>
<iframe id="hub" title="Cobalt GameHub"></iframe>
<div id="fatal" hidden></div>
<div id="install" hidden>
  <div class="box">
    <img src="icon-180.png" alt="">
    <b id="installTitle"></b>
    <p id="installText"></p>
    <button id="installSkip"></button>
  </div>
</div>
<script src="shell.js"></script>

</html>
